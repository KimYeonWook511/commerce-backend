name: CI

on:
  pull_request:
    branches: [ develop, main, 'release/**' ]

jobs: # 이 워크플로에서 실행할 작업들의 집합 # 하나의 workflow에 여러 job 가능
  # 단위/슬라이스 테스트만 분리: Docker 기동 없이 빠르게 피드백을 받는 잡
  unit-slice:
    name: 단위/슬라이스 테스트
    runs-on: ubuntu-latest
    steps:
      # PR의 소스 코드를 GitHub Actions 러너로 가져온다. 안 하면 소스 코드 없음 (gradlew, build.gradle 파일 못 찾음)
      - name: GitHub 저장소 코드를 러너 VM으로 가져옴
        uses: actions/checkout@v4

      # CI에서 사용할 JDK 21을 명시적으로 설치한다.
      # 로컬과 CI의 Java 버전 차이로 인한 문제를 방지한다.
      - name: Java 21 환경 구성
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # 가장 많이 쓰는 배포판 # Eclipse Temurin (OpenJDK) # 명시하는 이유 (러너 기본 Java 버전은 보장 안 됨, 로컬/서버/CI 버전 불일치 방지)
          cache: gradle  # Gradle 빌드 캐시 활성화

      # gradlew에 실행 권한이 없을 수 있으므로 권한을 부여한다.
      - name: gradlew 실행 권한 부여 # 로컬에서 안 터지는 이유는 Git 설정이나 OS 차이 때문
        run: chmod +x gradlew

      # 단위/슬라이스 테스트만 실행 (도커 불필요) | 테스트 실패 → CI 실패 (PR merge 차단 기능)
      - name: 단위/슬라이스 테스트 실행
        run: ./gradlew test --no-daemon

  # 통합 + 배치 테스트: Docker/Testcontainers 가 필요한 잡. unit-slice 와 병렬로 돈다.
  integration:
    name: 통합/배치 테스트
    runs-on: ubuntu-latest
    steps:
      - name: GitHub 저장소 코드를 러너 VM으로 가져옴
        uses: actions/checkout@v4

      - name: Java 21 환경 구성
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      # Testcontainers 기반 통합 테스트와 Spring Batch 통합 테스트를 같은 잡에서 실행
      # batch 클래스 수 적어 별도 잡 분리는 오버헤드가 더 큼
      - name: 통합/배치 테스트 실행
        run: ./gradlew integrationTest batchTest --no-daemon
