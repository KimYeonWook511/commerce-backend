name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest

    # deploy job 동작 중 사용할 환경변수
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/commerce-backend
      DEPLOY_PATH: /home/${{ secrets.SERVER_USER }}/commerce-platform/commerce-backend
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      # ${{ env.IMAGE_NAME }} : GitHub Actions YAML 단계에서 미리 문자열 치환
      # $IMAGE_NAME : 쉘 안에서 환경 변수를 사용함

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Java 21 세팅 (Gradle 빌드용)
      - name: Java 21 환경 구성
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle  # Gradle 빌드 캐시 활성화

      # Gradle 빌드
      - name: Build JAR with Gradle
        run: |
          # 실행 권한 부여
          chmod +x ./gradlew
          # 테스트 없이 build
          ./gradlew clean build -x test

      # DockerHub 로그인 (이미지 push를 위한 인증 단계)
      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | \
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Docker Buildx 세팅
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 멀티 아키텍처 Docker 이미지 빌드 & Push
      # 아키텍처는 CPU 종류
      # 대부분 서버, Github Actions Runner는 기본 amd64
      # 라즈베리파이, Apple Silicon은 기본 arm64
      - name: Build and Push Docker Image (Multi-Arch)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            --push .

      # SSH 설정
      - name: Setup SSH
        run: |
          # Github Actions Runner는 기본적으로 ~/.ssh 없음
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem
          # ssh-keyscan은 "ssh -o StrictHostKeyChecking=no" 보다 더 안전
          ssh-keyscan -p $SERVER_SSH_PORT -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # docker-compose 파일 업로드
      - name: Upload docker-compose.prod.yml
        run: |
          scp -i ssh_key.pem -P $SERVER_SSH_PORT docker-compose.prod.yml \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$DEPLOY_PATH

      # 서버 배포
      - name: Deploy via SSH
        run: |
          ssh -i ssh_key.pem -p $SERVER_SSH_PORT \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          "
            # 중간에 하나라도 실패하면 즉시 스크립트 종료
            set -e
          
            # 디버깅 용
            echo '>> Deploy start'
            echo ' > env.IMAGE_NAME: ${{ env.IMAGE_NAME }}:latest'
            echo ' > env.DEPLOY_PATH: ${{ env.DEPLOY_PATH }}'
            echo ' > $IMAGE_NAME: $IMAGE_NAME:latest'
            echo ' > $DEPLOY_PATH: $DEPLOY_PATH'

            # 디렉토리 이동
            # cd ${{ env.DEPLOY_PATH }} # 마스킹 안 될 수도 있음
            cd $DEPLOY_PATH

            # 최신 이미지 pull
            # docker pull ${{ env.IMAGE_NAME }}:latest # 마스킹 안 될 수도 있음
            docker pull $IMAGE_NAME:latest

            # 컨테이너 재기동
            export IMAGE_NAME=$IMAGE_NAME
            docker compose -f docker-compose.prod.yml down # 기존 컨테이너 중지
            docker compose -f docker-compose.prod.yml up -d

            # 사용하지 않는 이미지 정리
            # 나중에 서버에 image 최신 10개만 유지하도록 하고 docker hub에 이미지를 관리하도록 변경하기!
            docker image prune -f

            echo '>> Deploy finished successfully'
          "