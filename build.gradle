plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.commerce'
version = '0.0.1-SNAPSHOT'
description = 'commerce-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // logging
    // - SQL 쿼리 파라미터 로그 (외부 라이브러리: https://github.com/gavlyukovskiy/spring-boot-data-source-decorator)
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.10.0'
    // - JSON 구조화 로그 (logback-spring.xml의 LoggingEventCompositeJsonEncoder가 의존)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // mysql
    runtimeOnly 'com.mysql:mysql-connector-j'

    // h2
    runtimeOnly 'com.h2database:h2'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // 인터페이스
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5' // 구현체
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // json -> claims 처리

    // spring batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    testImplementation 'org.springframework.batch:spring-batch-test'

    // kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // test container
    testImplementation platform('org.testcontainers:testcontainers-bom:1.19.8')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

tasks.named('test') {
    systemProperty 'spring.profiles.active', 'test'

    useJUnitPlatform {
        excludeTags "concurrency", "test", "batch", "docker", "sandbox"
    }
}

def loadDotEnv = { File envFile ->
    if (!envFile.exists()) {
        return [:]
    }

    envFile.readLines()
        .collect { it.trim() }
        .findAll { it && !it.startsWith("#") && it.contains("=") }
        .collectEntries { line ->
            def index = line.indexOf("=")
            def key = line.substring(0, index).trim()
            def value = line.substring(index + 1).trim()

            if ((value.startsWith("\"") && value.endsWith("\""))
                || (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }

            if (!value) {
                return [:]
            }

            [(key): value]
        }
}

def resolveDockerCommand = {
    def output = new ByteArrayOutputStream()

    try {
        exec {
            commandLine 'sh', '-c', 'command -v docker'
            standardOutput = output
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }

        def dockerPath = output.toString().trim()
        if (dockerPath) {
            return dockerPath
        }
    } catch (Exception ignored) {
    }

    def candidates = [
            '/opt/homebrew/bin/docker',
            '/usr/local/bin/docker',
            '/usr/bin/docker'
    ]

    candidates.find { file(it).exists() } ?: 'docker'
}

tasks.register('ciTest', Test) {
    group = 'verification'
    description = 'Runs normal tests and Docker/Testcontainers tests for CI.'

    systemProperty 'spring.profiles.active', 'test'

    useJUnitPlatform {
        excludeTags "concurrency", "test", "batch", "sandbox"
    }
}

tasks.register('dockerTest', Test) {
    group = 'verification'
    description = 'Runs tests that require Docker/Testcontainers.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')

    systemProperty 'spring.profiles.active', 'test'

    doFirst {
        ByteArrayOutputStream output = new ByteArrayOutputStream()
        ExecResult result

        def dockerCommand = resolveDockerCommand()
        try {
            result = exec {
                commandLine dockerCommand, 'info'
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
        } catch (Exception ex) {
            throw new GradleException(
                "docker 명령어를 실행할 수 없습니다. Docker Desktop 설치 상태와 Gradle 실행 환경의 PATH를 확인하세요.",
                ex
            )
        }

        if (result.exitValue != 0) {
            List<String> outputLines = output.toString()
                .readLines()
                .findAll { !it.isBlank() }
            String details = outputLines.isEmpty() ? null : outputLines.last()

            String message = "Docker daemon에 연결할 수 없습니다. Docker Desktop을 실행한 뒤 dockerTest를 다시 실행하세요."
            if (details) {
                message += "\n세부 원인: ${details}"
            }

            throw new GradleException(message)
        }
    }

    useJUnitPlatform {
        includeTags "docker"
    }
}

tasks.register('concurrencyTest', Test) {
    group = 'verification'
    description = 'Runs concurrency-tagged tests in isolation from the default test task.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')

    systemProperty 'spring.profiles.active', 'test'

    useJUnitPlatform {
        includeTags "concurrency"
    }
}

tasks.register('naverPaySandboxTest', Test) {
    group = 'verification'
    description = 'Runs NaverPay sandbox integration tests with values from .env.sandbox.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')

    systemProperty 'spring.profiles.active', 'test'

    loadDotEnv(file('.env.sandbox')).each { key, value ->
        environment key, value
    }

    useJUnitPlatform {
        includeTags "sandbox"
    }
}
