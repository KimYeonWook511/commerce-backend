# ArchUnit freeze(baseline) 설정 — 구조 마이그레이션 동안만 사용한다.
# 현재 위반을 archunit_store/ 스냅샷에 박고(최초 실행 시 생성), 새 위반만 실패시킨다.
# 전 도메인 재배치가 끝나 위반이 0이 되면 ArchitectureRulesTest 의 freeze 래핑과 함께 이 파일도 제거한다.
freeze.store.default.allowStoreCreation=true
freeze.store.default.path=archunit_store

# 마이그레이션 중에는 아직 안 생긴 패키지(application.usecase 등)를 대상으로 하는 규칙의
# "검사 대상 0건"을 실패로 치지 않는다. 재배치가 끝나 패키지가 채워지면 이 줄을 제거한다.
archRule.failOnEmptyShould=false
