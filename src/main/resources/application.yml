server:
  port: 8080

spring:
  jpa:
    # 트랜잭션마다 영속성 컨텍스트를 새로 연다. 요청 단위로 열어 두면 잠금 전에 읽은 값이 캐시로 남아
    # 잠금 뒤 읽기에 섞인다. 프로필별 파일에 적으면 검증이 도는 test 프로필만 옛 값으로 남는다.
    open-in-view: false
  task:
    scheduling:
      pool:
        # 결제 후처리를 뺀 나머지 — 주문 만료와 재고 복구 아웃박스가 나눠 쓴다. 주문 만료는 배치를
        # 동기로 실행해 스레드를 통째로 잡으므로, 하나면 그 시간 동안 아웃박스가 멈춘다.
        size: 2

payment:
  postprocess:
    scheduler:
      # 대사를 뺀 넷(환불 발송·결제 통지·환불 통지·만료)이 쓴다. 결제사를 부르는 것은 발송뿐이고,
      # 안 나가면 회원 돈이 묶이므로 굶으면 안 되는 쪽이다. 실측이 아니라 추정값이다.
      pool-size: 2
      # 대사 전용. 한 주기에 대상을 다 처리하므로 밀린 만큼 스레드를 오래 잡아 위 풀과 나눈다.
      # 결제 대사와 환불 대사가 서로도 밀리지 않게 둘을 받는다. 실측이 아니라 추정값이다.
      reconcile-pool-size: 2
    reconcile:
      cron: "0 */1 * * * *"
      # 승인 호출의 읽기 제한 시간보다 길어야 한다. 짧으면 요청 흐름이 아직 응답을 기다리는 중인
      # 건을 대사가 집어 같은 결제에 승인이 겹쳐 나간다.
      grace: 30s
      intervals: 10s,30s,2m,5m,10m
      # 한 회차에 집는 개수를 자르지 않는다 — 자른다고 총 처리 시간이 줄지 않고 남은 건이 다음 회차로
      # 밀릴 뿐이다. 대신 이 수를 넘으면 밀렸다고 보고 알린다. 실측이 아니라 추정값이다.
      backlog-threshold: 500
    notify:
      cron: "0 */10 * * * *"
      escalation: 1h
      interval: 1h
    expire:
      cron: "0 */10 * * * *"
      threshold: 1h
    refund:
      dispatch:
        cron: "0 */1 * * * *"
      reconcile:
        cron: "0 */1 * * * *"
        # 결제보다 길다. 겹쳐 전송되면 같은 취소가 두 번 나가지만, 결제는 재요청이 겹쳐도 결제사가
        # 이미 진행 중으로 막는다.
        grace: 90s
      notify:
        cron: "0 */10 * * * *"
