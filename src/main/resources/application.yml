server:
  port: 8080

spring:
  task:
    scheduling:
      pool:
        # 결제 후처리를 뺀 나머지 — 주문 만료와 재고 복구 아웃박스가 나눠 쓴다. 주문 만료는 배치를
        # 동기로 실행해 스레드를 통째로 잡으므로, 하나면 그 시간 동안 아웃박스가 멈춘다.
        size: 2

payment:
  postprocess:
    scheduler:
      # 여섯 중 결제사를 부르는 것은 셋(결제 대사·환불 대사·환불 발송)이고 모두 1분 주기다.
      # 셋이 겹치면 하나는 밀리지만, 동시에 다 부른다고 빨라지지 않는다 — 병목이 결제사로 옮겨갈
      # 뿐이고 결제사 쪽 동시 호출 허용치를 아직 모른다. 실측이 아니라 추정값이다.
      pool-size: 2
    reconcile:
      cron: "0 */1 * * * *"
      # 승인 호출의 읽기 제한 시간보다 길어야 한다. 짧으면 요청 흐름이 아직 응답을 기다리는 중인
      # 건을 대사가 집어 같은 결제에 승인이 겹쳐 나간다.
      grace: 30s
      intervals: 10s,30s,2m,5m,10m
    notify:
      cron: "0 */10 * * * *"
      escalation: 1h
      interval: 1h
    expire:
      cron: "0 */10 * * * *"
      threshold: 1h
    refund:
      dispatch:
        cron: "0 */1 * * * *"
      reconcile:
        cron: "0 */1 * * * *"
        # 결제보다 길다. 겹쳐 전송되면 같은 취소가 두 번 나가지만, 결제는 재요청이 겹쳐도 결제사가
        # 이미 진행 중으로 막는다.
        grace: 90s
      notify:
        cron: "0 */10 * * * *"
