spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}

  data:
    redis:
      host: ${PROD_REDIS_HOST}
      port: ${PROD_REDIS_PORT}
      password: ${PROD_REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update # 추후 DB 마이그레이션 학습 후 validate로 변경할 것 (운영 서버는 명시적 DB 마이그레이션 하기)
    properties:
      hibernate:
        show_sql: false
        format_sql: true # SQL을 보기 좋게 포맷팅해서 출력
        use_sql_comments: true # JPQL/HQL 주석을 SQL에 함께 출력
        #default_batch_fetch_size: 100
    #open-in-view: false # default true

logging:
  level:
    root: INFO

jwt:
  access:
    secret.key: ${PROD_JWT_ACCESS_SECRET} # HMAC-SHA algorithms MUST have a size >= 256 bits
    expiration: ${PROD_JWT_ACCESS_EXPIRATION}
  refresh:
    secret.key: ${PROD_JWT_REFRESH_SECRET} # HMAC-SHA algorithms MUST have a size >= 256 bits
    expiration: ${PROD_JWT_REFRESH_EXPIRATION}

naverpay:
  client-id: ${PROD_NAVERPAY_CLIENT_ID}
  chain-id: ${PROD_NAVERPAY_CHAIN_ID}
  return-url: ${PROD_NAVERPAY_RETURN_URL}