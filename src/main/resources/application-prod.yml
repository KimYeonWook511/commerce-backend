spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
  data:
    redis:
      host: ${PROD_REDIS_HOST}
      port: ${PROD_REDIS_PORT}
      password: ${PROD_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update # 추후 DB 마이그레이션 학습 후 validate로 변경할 것 (운영 서버는 명시적 DB 마이그레이션 하기)
    properties:
      hibernate:
        show_sql: false
        format_sql: true # SQL을 보기 좋게 포맷팅해서 출력
        use_sql_comments: true # JPQL/HQL 주석을 SQL에 함께 출력
        #default_batch_fetch_size: 100
    #open-in-view: false # default true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  kafka:
    bootstrap-servers: ${PROD_KAFKA_HOST}:${PROD_KAFKA_PORT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    root: INFO

jwt:
  access:
    secret.key: ${PROD_JWT_ACCESS_SECRET} # HMAC-SHA algorithms MUST have a size >= 256 bits
    expiration: ${PROD_JWT_ACCESS_EXPIRATION}
  refresh:
    secret.key: ${PROD_JWT_REFRESH_SECRET} # HMAC-SHA algorithms MUST have a size >= 256 bits
    expiration: ${PROD_JWT_REFRESH_EXPIRATION}

naverpay:
  client-id: ${PROD_NAVERPAY_CLIENT_ID}
  client-secret: ${PROD_NAVERPAY_CLIENT_SECRET}
  chain-id: ${PROD_NAVERPAY_CHAIN_ID}
  return-url: ${PROD_NAVERPAY_RETURN_URL}
  approval-url: ${PROD_NAVERPAY_APPROVAL_URL}
  cancel-url: ${PROD_NAVERPAY_CANCEL_URL}

outbox:
  stock-restore:
    relay:
      topic: ${PROD_OUTBOX_STOCK_RESTORE_TOPIC:stock-restore-events}
      send-timeout-millis: 5000
    publisher:
      cron: "*/10 * * * * *"
      batch-size: 100
    retry-publisher:
      cron: "*/10 * * * * *"
    stale-recovery:
      cron: "*/30 * * * * *"
    stale-publishing-seconds: 300
    retry:
      base-seconds: 30
      max-seconds: 3600

order:
  expiration:
    minutes: 60
    batch:
      cron: "0 */5 * * * *"
      chunk-size: 100
