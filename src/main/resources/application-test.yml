spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    root: WARN
    org.hibernate.SQL: debug
    p6spy: info
    com.commerce.order.batch.listener: info
    com.commerce.outbox: info

jwt:
  access:
    secret.key: testAccessSecretKey0123456789abcdef!!
    expiration: 1800000
  refresh:
    secret.key: testRefreshSecretKey0123456789abcdef!!
    expiration: 604800000

naverpay:
  client-id: test
  client-secret: test
  chain-id: test
  return-url: https://test
  approval-url: https://test
  cancel-url: https://test

outbox:
  stock-restore:
    relay:
      topic: test-stock-restore-events
      send-timeout-millis: 5000
    publisher:
      cron: "*/10 * * * * *"
      batch-size: 100
    retry-publisher:
      cron: "*/10 * * * * *"
    stale-recovery:
      cron: "*/30 * * * * *"
    stale-publishing-seconds: 300
    retry:
      base-seconds: 30
      max-seconds: 3600

order:
  expiration:
    minutes: 60
    batch:
      cron: "0 */5 * * * *"
      chunk-size: 100
