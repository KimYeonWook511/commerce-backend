spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    org.hibernate.SQL: debug
    p6spy: info

jwt:
  access:
    secret.key: testAccessSecretKey0123456789abcdef!!
    expiration: 1800000
  refresh:
    secret.key: testRefreshSecretKey0123456789abcdef!!
    expiration: 604800000

naverpay:
  client-id: test
  client-secret: test
  chain-id: test
  return-url: https://test
  approval-url: https://test
  cancel-url: https://test