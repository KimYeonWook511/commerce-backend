spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  access:
    secret.key: testAccessSecretKey0123456789abcdef!!
    expiration: 1800000
  refresh:
    secret.key: testRefreshSecretKey0123456789abcdef!!
    expiration: 604800000

naverpay:
  client-id: test
  client-secret: test
  chain-id: test
  return-url: https://test
  approval-url: https://test
  cancel-url: https://test
  payment-history-url: https://test

outbox:
  stock-restore:
    relay:
      topic: test-stock-restore-events
      send-timeout-millis: 5000
    consumer:
      group-id: stock-restore-consumer
      dlt:
        enabled: true
        suffix: .DLT
      retry:
        max-attempts: 3
        initial-interval-millis: 1000
        multiplier: 2.0
        max-interval-millis: 10000
    producer:
      cron: "*/10 * * * * *"
      batch-size: 100
    retry-producer:
      cron: "*/10 * * * * *"
    stale-recovery:
      cron: "*/30 * * * * *"
    stale-publishing-seconds: 300
    retry:
      base-seconds: 30
      max-seconds: 3600

order:
  expiration:
    minutes: 60
    batch:
      cron: "0 */5 * * * *"
      chunk-size: 100
