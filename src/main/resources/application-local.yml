spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:13336}/${LOCAL_DB_NAME:commerce_db}
    username: ${LOCAL_DB_USER:root}
    password: ${LOCAL_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: true # SQL을 보기 좋게 포맷팅해서 출력
        use_sql_comments: true # JPQL/HQL 주석을 SQL에 함께 출력
        #default_batch_fetch_size: 100
    #open-in-view: false # default true

logging:
  level:
    org.hibernate.SQL: debug
