spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:3306}/${LOCAL_DB_NAME:commerce_db}
    username: ${LOCAL_DB_USER:root}
    password: ${LOCAL_DB_PASSWORD}
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: true # SQL을 보기 좋게 포맷팅해서 출력
        use_sql_comments: true # JPQL/HQL 주석을 SQL에 함께 출력
        #default_batch_fetch_size: 100
    #open-in-view: false # default true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  kafka:
    bootstrap-servers: ${LOCAL_KAFKA_HOST:localhost}:${LOCAL_KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  access:
    secret.key: ${LOCAL_JWT_ACCESS_SECRET} # HMAC-SHA algorithms MUST have a size >= 256 bits
    expiration: 1800000 # 30분 (30 * 60 * 1000)
  refresh:
    secret.key: ${LOCAL_JWT_REFRESH_SECRET} # HMAC-SHA algorithms MUST have a size >= 256 bits
    expiration: 604800000 # 7일 (7 * 24 * 60 * 60 * 1000)

naverpay:
  client-id: ${LOCAL_NAVERPAY_CLIENT_ID}
  client-secret: ${LOCAL_NAVERPAY_CLIENT_SECRET}
  chain-id: ${LOCAL_NAVERPAY_CHAIN_ID}
  return-url: ${LOCAL_NAVERPAY_RETURN_URL}
  approval-url: ${LOCAL_NAVERPAY_APPROVAL_URL}
  cancel-url: ${LOCAL_NAVERPAY_CANCEL_URL}

order:
  expiration:
    minutes: 60
    batch:
      cron: "0 */5 * * * *"
      chunk-size: 100

outbox:
  stock-restore:
    relay:
      topic: ${LOCAL_OUTBOX_STOCK_RESTORE_TOPIC:stock-restore-events}
      send-timeout-millis: 5000
    consumer:
      group-id: stock-restore-consumer
      retry:
        max-attempts: 3
        initial-interval-millis: 1000
        multiplier: 2.0
        max-interval-millis: 10000
    producer:
      cron: "*/10 * * * * *"
      batch-size: 100
    retry-producer:
      cron: "*/10 * * * * *"
    stale-recovery:
      cron: "*/30 * * * * *"
    stale-publishing-seconds: 300
    retry:
      base-seconds: 30
      max-seconds: 3600
