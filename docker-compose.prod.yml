#version: "3.8"

services:
  app:
    image: ${IMAGE_NAME}:latest # cd.yml 에서 deploy job 환경변수로 선언되어 있음
    container_name: commerce-backend
    restart: always
    # port: # 굳이 외부 8080포트를 열 필요가 없음 (도커 네트워크로 통신할 것이기 때문)
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # DB 정보는 .env.prod 에서 주입
    env_file:
      - .env.prod
    networks:
      - commerce-network

networks:
  commerce-network:
    external: true
