# 도메인 용어집. 대화·문서·코드가 같은 용어를 같은 뜻으로 쓰게 한다.
# 이 spec이 실제로 쓰는 용어만 담는다. 새로 만드는 용어는 없고, 기존 용어의 경계를 분명히 한다.
glossary:
  - term: 결제 전 주문
    definition: 주문은 만들어졌으나 결제 승인이 아직 확정되지 않은 주문.
    code_identifier: OrderStatus.INIT
    notes: >
      "결제를 시작하지 않은 주문"이 아니다. 결제창을 열었거나 승인을 요청한 중이거나 결과를 모르는
      주문도 승인이 확정되기 전까지는 전부 여기 속한다.

  - term: 결제완료 주문
    definition: 결제 승인이 확정되어 주문이 성립한 주문.
    code_identifier: OrderStatus.PAID
    notes: >
      승인 확정과 주문 완료가 한 트랜잭션이라, 승인 성공한 결제가 걸린 주문은 결제 전 주문일 수 없다.
      부분취소로 일부만 남아도 잔여가 있으면 결제완료 주문으로 남는다.

  - term: 주문 취소
    definition: 주문의 종착 상태. 이 주문으로는 더 결제할 수 없다.
    code_identifier: OrderStatus.CANCELED
    notes: 결제완료 주문은 모든 품목의 잔여수량이 0이 될 때에만 이 상태로 전이한다.

  - term: 결제 전 취소 전이
    definition: 결제 전 주문을 취소 상태로 만드는 도메인 전이. 되돌릴 돈이 없어 품목을 지정하지 않는다.
    code_identifier: Order.cancelBeforePayment
    notes: >
      이 spec이 바꾸는 것은 이 전이 자체가 아니라 누가 여기에 닿을 수 있는가다.
      지금은 회원 직접 취소와 만료 배치 둘이 부르고, 이 spec 뒤에는 만료 배치만 부른다.

  - term: 결제 전 취소 관문
    definition: 회원의 결제 전 취소 요청을 받아 전이와 재고 복구를 한 트랜잭션으로 묶던 자리.
    code_identifier: CancelOrderService
    notes: >
      이 spec이 제거한다. 프로덕션 호출처가 취소 흐름 조립 자리 하나뿐이고 그 호출이 사라지기 때문이다.
      만료 배치는 이 관문을 쓰지 않고 자기 만료 트랜잭션이 전이를 직접 부른다.

  - term: 취소 가능 판정
    definition: 이 주문을 취소할 수 있는 상태인지 주문이 스스로 판정하는 것. 결제완료 주문만 통과한다.
    code_identifier: Order.checkCancellable
    notes: >
      이 spec이 새로 만드는 규칙이 아니다. 결제완료 취소 관문이 상태를 꺼내 비교하던 가드를 도메인으로
      옮긴 것이며, 상태에서 파생되는 규칙이라 주문이 알아야 한다. Order.checkPayable과 같은 형태로,
      통과하면 아무것도 돌려주지 않고 막히면 도메인 예외를 던진다.

      보는 것은 주문 상태 하나다. 그 주문에 걸린 결제가 어디까지 갔는지는 묻지 않는다 — 결제 전
      주문은 결제가 어떤 상태든 결과가 거부로 같기 때문이다.

      품목 단위로 잔여수량을 보는 OrderItem.checkCancellable(수량)과 짝이다. 같은 물음을 두 층위에서
      나눠 답한다 — 이 판정은 주문 상태를, 그쪽은 그 품목에서 그 수량을 취소할 수 있는지를 본다.

      결제완료 취소 관문이 주문 행을 잠그고 멱등 재생을 판정한 다음에 부른다. **같은 결제·요청자·요청
      키의 환불이 이미 있는 재요청만** 그 재생 판정에서 앞선 결과를 받고 나가 이 판정에 닿지 않는다.
      만료 배치가 취소한 주문이나 다른 요청 키로 온 재요청은 이 판정에 닿아 거부된다. 부르는 순서를
      바꾸면 그 재생이 조용히 깨진다.

      같은 관문 안의 "승인 결과를 모르는 결제" 검사보다도 앞에서 불러야 한다. 뒤에 두면 결제 전 주문이
      취소 불가가 아니라 "결제 확인 중"이라는, 그 주문에서는 실현될 길이 없는 안내를 받는다.

      만료 배치는 자기 선별 기준으로 대상을 고르므로 이 판정을 지나지 않는다.

  - term: 결제완료 취소 관문
    definition: 결제완료 주문의 품목·수량을 취소하고 그 값어치만큼 환불을 여는 트랜잭션 자리.
    code_identifier: CancelPaidOrderService
    notes: >
      결제 전 취소 관문과 다른 자리다 — 결제완료 주문은 상태만으로 취소 가능 여부가 정해지지 않기 때문이다.
      이 spec은 이 관문의 상태 가드를 주문 도메인의 취소 가능 판정으로 옮기고, 나머지는 그대로 둔다.

  - term: 주문 만료
    definition: 만든 지 정해진 시간이 지난 결제 전 주문을 시스템이 정리하는 것.
    code_identifier: ExpireOrderService
    notes: >
      결제 전 취소와 같은 전이를 쓰지만 재고 복구 방식이 다르다 — 만료는 재고 복구 이벤트를 만들어
      비동기로 돌려주고, 결제완료 취소는 같은 트랜잭션 안에서 동기로 돌려준다.

  - term: 활성 슬롯
    definition: 한 주문에 살아 있는 결제가 최대 하나임을 보장하는 자리.
    code_identifier: Payment.activeOrderKey
    notes: >
      결제창을 띄운 것부터 결과를 모르는 것, 승인에 성공한 것까지가 이 자리를 쥔다.
      만료 배치는 이 자리를 쥔 결제가 걸린 주문을 만료 대상에서 제외한다.

  - term: 반려 환불
    definition: 승인은 났는데 우리가 받아들일 수 없어 곧바로 되돌리는 환불.
    code_identifier: RefundReason.ORDER_NOT_PAYABLE
    notes: >
      승인을 확정할 수 없는 주문 상태일 때 생긴다 — 확정 시도가 던진 주문 오류를 그대로 받아 반려하므로
      이미 취소된 주문뿐 아니라 이미 결제완료된 주문도 같은 사유로 모인다. 극단 경합을 받치는 안전망으로
      설계된 것이며, 이 spec은 그중 "이미 취소된 주문" 경우가 정상 흐름에서 생기지 않게 한다.
