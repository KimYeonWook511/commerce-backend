# 도메인 용어집. 대화·문서·코드가 같은 용어를 같은 뜻으로 쓰게 한다.
# 한 용어 = 한 뜻. 겹치거나 모호한 용어는 여기서 정리한다.
#
# 이 spec이 새로 들이거나 뜻을 좁히는 용어만 담는다. 이미 저장소에 자리잡은 용어는
# 혼동이 생기는 것만 적는다.
glossary:
  - term: 취소
    definition: 회원이 주문의 품목과 수량을 지정해 되돌리는 행위.
    code_identifier: cancel
    notes: >
      돈이 돌아가는 것은 "환불"이라 부르고 이것과 구분한다. 배송 후 되돌리는 개념이 생기면
      그때 "반품"이라는 새 용어를 쓴다 — 배송 도메인이 없는 지금은 모든 취소가 배송 전 취소다.

  - term: 환불
    definition: 취소의 결과로 돈이 돌아가는 것. 취소 요청 하나가 환불 하나를 만든다.
    code_identifier: Refund
    notes: >
      결제 하나에 환불이 여러 건 달릴 수 있다. 회원 요청으로 만들어지는 것과 잘못된 승인을
      되돌리는 보상으로 만들어지는 것이 있고, 요청자로 구분한다.

  - term: 부분취소
    definition: 주문의 일부 품목·수량만 취소하는 것.
    code_identifier: partial cancel
    notes: >
      별도 기능이 아니라 취소의 일반형이다. 품목 목록을 생략하면 잔여 전부 취소가 되며
      같은 경로를 지난다.

  - term: 잔여 전부 취소
    definition: 아직 취소되지 않은 수량 전부를 한 번에 취소하는 것.
    code_identifier: cancel remaining
    notes: >
      "전액취소"라 부르지 않는다. 이미 일부를 취소한 주문에서는 전액이 아니라 남은 만큼만
      취소되기 때문이다. 부분취소 도입 전의 기능을 가리킬 때는 그때 실제로 전액이었으므로
      "전액취소"를 그대로 쓴다.

  - term: 취소수량
    definition: 한 주문 품목이 지금까지 취소된 수량의 누계.
    code_identifier: cancelledQuantity
    notes: >
      오르기만 하고 내려가지 않는다. 환불이 실패해도 되돌리지 않는다.
      잘못된 승인을 되돌리는 보상은 이 값을 올리지 않는다.

  - term: 잔여수량
    definition: 한 주문 품목에서 아직 취소할 수 있는 수량. `주문수량 − 취소수량`.
    code_identifier: remainingQuantity
    notes: >
      저장하지 않고 계산한다. 취소 가능 여부를 판정하는 축이다.

  - term: 취소 품목 내역
    definition: 환불 한 건이 어느 주문 품목을 몇 개 취소했는지 남긴 기록.
    code_identifier: OrderItemCancellation
    notes: >
      환불이 자동으로 끝나지 않아 사람이 이어받을 때의 복구 근거다. 주문 품목의 취소수량은
      누계로만 쌓여 어느 요청이 얼마를 취소했는지 알 수 없고, 금액에서 역산하면 단가가 같은
      조합을 구분하지 못한다.

  - term: 돌려주기로 한 금액
    definition: 한 결제에서 지금까지 접수된 환불 금액의 합.
    code_identifier: refundOpenedAmount
    notes: >
      환불을 열 때 오르고 성공·실패·검토 대기 어느 쪽으로도 내려가지 않는다.
      "더 환불받을 수 있는 금액"은 `승인 금액 − 이 값`이다.

  - term: 실제로 돌아간 금액
    definition: 한 결제에서 결제사가 실제로 되돌려준 금액의 합.
    code_identifier: refundSucceededAmount
    notes: >
      환불이 확정될 때 오른다. "돌려주기로 한 금액"과 다른 값이며 그것을 넘을 수 없다.

  - term: 중복 방지 키
    definition: 회원이 취소 요청마다 붙여 보내는 문자열. 같은 키면 같은 요청으로 본다.
    code_identifier: idempotencyKey
    notes: >
      겹치면 안 되는 범위는 결제·요청자·요청 키 세 값이다. 주문 생성에도 같은 이름의
      헤더가 있으나 그쪽 범위는 회원 단위라 더 넓다.

  - term: 대사
    definition: >
      외부 결제사 호출이 끊기거나 결과가 불확실한 건을 배치가 주기적으로 다시 조회해
      상태를 확정하고 재시도하는 것.
    code_identifier: reconcile
    notes: 이 spec이 대사의 동작을 바꾸지 않는다.

  - term: 취소 요청 수량
    definition: 한 취소 요청에서 그 품목을 몇 개 취소하는가. 누계가 아니라 이번 회차의 수량이다.
    code_identifier: quantity
    notes: >
      "취소수량"은 누계이고 이것은 이번 회차다. 환불 금액과 재고 복구 수량은 **이것**으로 계산한다 —
      누계로 계산하면 앞서 환불한 몫이 다시 들어가고 재고가 과다 복구된다.

  - term: 취소 값어치
    definition: 이번 취소 요청으로 돌려줄 금액. `Σ(단가 × 취소 요청 수량)`.
    code_identifier: (Design에서 이름을 고정하지 않는다)
    notes: >
      주문이 계산해 결제에 넘기는 값이며 응답의 이번 환불액이 된다. 단가가 주문 시점 사본이라
      상품 판매가가 바뀌어도 달라지지 않는다.

  - term: 확정된 줄
    definition: 검증을 통과해 실제로 취소할 것으로 정해진 (주문 품목, 취소 요청 수량) 목록.
    code_identifier: (Design에서 이름을 고정하지 않는다)
    notes: >
      검증·계산 관문이 돌려주고 반영 관문이 받는다. 목록을 생략한 요청은 이 단계에서 잔여가 남은
      품목만 골라 채워지며, 그 결과가 비면 거절된다.
