# 이 spec이 건드리는 aggregate. 부분취소로 경계가 바뀌거나 구성원이 느는 것만 적는다.

aggregate:
  name: Order
  root: Order
  purpose: >
    한 주문에서 무엇이 얼마나 취소됐는지의 일관성을 지킨다. 품목별 취소수량과 그 근거인 취소
    내역, 그리고 "모두 취소됐는가"에서 파생되는 주문 상태가 함께 맞아야 한다.

  members:
    - OrderItem — 주문에 담긴 상품 한 줄. 주문수량·단가·취소수량을 가진다
    - 취소 품목 내역 — 취소 한 번이 어느 주문 품목을 몇 개 취소했는지. OrderItem의 자식이다

  invariants:
    - 품목의 취소수량은 0 이상 주문수량 이하다
    - 품목의 취소수량은 오르기만 하고 내려가지 않는다 (취소를 되돌리지 않기 때문이다)
    - 한 품목의 취소 내역 수량 합은 그 품목의 취소수량과 같다
    - 요청의 어느 한 품목이라도 잔여수량을 넘으면 그 요청 전체가 아무것도 바꾸지 않는다
    - 결제완료 주문이 취소로 전이하는 것은 모든 품목의 잔여수량이 0이 될 때뿐이다
      (결제 전 취소와 이 작업 이전에 취소된 주문은 취소수량이 0인 채로 취소 상태다 — 상시 불변식이 아니다)
    - 총 주문 금액은 취소로 줄어들지 않는다 (주문 시점 금액의 사본이며 결제 금액이 여기서 나왔다)

  states: [INIT, PAID, CANCELED]
  transitions:
    - "INIT -> CANCELED : 결제 전 취소 (사용자 직접 · 배치 만료). 취소수량을 올리지 않는다"
    - "INIT -> PAID : 결제 승인 확정"
    - "PAID -> CANCELED : 품목 취소로 모든 품목의 잔여수량이 0이 될 때"

  references_by_id:
    - Payment (orderId 역방향 — 결제가 주문을 가리킨다)
    - Refund (취소 품목 내역의 refundId)

  notes: >
    취소 품목 내역이 다른 aggregate의 루트 식별자(refundId)를 갖는 것은 규칙대로다. 반대로 이
    내역을 Payment 쪽에 두면 그 행이 OrderItem 식별자를 갖게 되는데, 그것은 루트가 아니라
    aggregate 내부 엔티티의 식별자라 규칙에서 벗어난다.

    상태 전이를 공개 메서드로 열지 않는다. 품목을 취소하는 관문 안에서 모든 잔여가 0인지 스스로
    묻고 전이한다. 열어 두면 잔여가 남았는데도 밖에서 전이시킬 수 있다.

    결제 전 취소와 결제완료 취소를 다른 관문으로 가른다. 부분취소가 들어오면 상태만으로는 취소
    가능 여부가 정해지지 않기 때문이다 — 결제완료이면서 일부만 남은 주문이 정상 상태다.

---

aggregate:
  name: Payment
  root: Payment
  purpose: >
    한 결제에서 돈이 얼마나 돌려주기로 됐고 얼마나 실제로 돌아갔는지의 일관성을 지킨다.
    이 spec이 이 경계를 바꾸지 않으며, 여기 적는 것은 부분취소가 기대는 전제다.

  members: []   # 결제 행 자신뿐이다. 환불은 별도 루트다(아래).

  invariants:
    - 돌려주기로 한 금액의 합은 승인 금액을 넘지 않는다
    - 실제로 돌아간 금액은 돌려주기로 한 금액을 넘지 않는다
    - 돌려주기로 한 금액은 환불을 열 때 오르고 성공·실패 어느 쪽으로도 내려가지 않는다

  references_by_id:
    - Order (orderId)
    - Refund (환불이 결제를 paymentId로 가리킨다 — 역방향)

  notes: >
    부분취소는 이 경계에 두 가지를 요구한다 — 한 결제에 환불이 여러 건 달릴 수 있을 것(이미 된다),
    그리고 환불 금액을 밖에서 받을 것(이미 그렇다). 주문이 계산한 취소 값어치를 받아 자기 한도로
    판정한다. 결제가 주문 품목을 읽지 않는다.

    부분취소가 이 경계에 새로 만드는 것은 경합이다. 같은 결제에 취소를 여러 번 걸므로 앞선 환불의
    성공 확정과 다음 취소의 환불 접수가 같은 결제 행을 두고 다툰다. 정상 경합이며 회원 요청이
    거절되는 것으로 끝난다.

---

aggregate:
  name: Refund
  root: Refund
  purpose: >
    돌려주기로 한 돈 한 건의 진행 상태를 지킨다. 결제를 식별자로 참조하고 자기 전이 메서드와
    자기 낙관 락을 갖는 독립 루트다 — 이 spec이 그렇게 만드는 것이 아니라 이미 그렇다.

  members: []

  invariants:
    - 결제사 호출 결과가 확정되기 전에는 종착 상태로 가지 않는다
    - 실패로 끝나는 종착이 없다 (자동으로 갈 수 있는 종착은 성공뿐이다)

  references_by_id:
    - Payment (paymentId)

  notes: >
    이 spec이 환불의 속성도 상태 전이도 바꾸지 않는다. 취소 품목 내역이 이 루트를 식별자로
    가리킬 뿐이며, **그것이 루트 식별자라는 사실이 그 배치의 근거다.** 환불이 결제의 내부
    구성원이었다면 같은 참조가 다른 aggregate의 내부 엔티티를 가리키는 것이 되어 성립하지 않는다.
