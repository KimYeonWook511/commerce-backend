# 도메인 용어집. 대화·문서·코드가 같은 용어를 같은 뜻으로 쓰게 한다.
# 한 용어 = 한 뜻. 겹치거나 모호한 용어는 여기서 정리한다.
glossary:
  - term: 취소
    definition: 주문을 무르는 것.
    code_identifier: cancel
    notes: >
      결제 금액을 돌려주는 것은 "환불"이라 부른다. 결제사 문서는 환불을 "취소"라 부르지만,
      그 어휘는 어댑터 안에 가두고 도메인으로 들이지 않는다.

  - term: 환불
    definition: 결제한 금액을 되돌려주는 것.
    code_identifier: refund
    notes: >
      매입 전 승인 취소와 매입 후 환불을 가르지 않는다. 결제사가 시점에 따라 알아서 처리한다.
      생기는 경로가 둘이다 — 회원이 주문을 취소한 것과, 승인이 성립했으나 그 결제를 인정할 수 없어
      시스템이 곧바로 되돌리는 것이다. 둘 다 같은 환불 사건으로 만들고 사유로 가른다.

  - term: 승인 반려
    definition: >
      결제사 승인은 성공했는데 우리 확인에서 그 결제를 받아들일 수 없어, 그 결제를 반려로 종결하는 것.
      돈이 이미 나갔으면 환불을 같은 저장에서 함께 만든다.
    code_identifier: reject
    notes: >
      두 경우다 — 회원이 인증하는 사이 주문이 취소됐거나, 승인 금액이 우리 기록과 다르거나.
      둘 다 돈이 나갔으므로 환불이 따르고 결제가 REJECTED로 종결된다.
      결제 키 불일치는 우리 결제에 승인이 나지 않은 것이라 반려가 아니다 — 우리 기록만 FAILED로
      표시하고, 나간 돈은 그 키의 주인 결제의 것이므로 그 행을 회수한다.
      환불이 따르는 경우 금액은 그 시점의 "남은 한도"이고 결제당 한 건이다. 정상 경로에서는 그 값이 늘
      승인 금액 전액이다 — 반려는 결제가 성공으로 확정되기 전에 판단하므로 그 시점에 딸린 환불이 없다.
      그래도 전액으로 고정하지 않는 것은, 둘이 다른 순간이 곧 이상 상태이고 그때 한도 초과로 거절되면
      반려가 통째로 롤백되어 되돌릴 근거가 사라지기 때문이다.
      남은 한도가 0이면 환불도 만들지 않고 결제도 건드리지 않는다 — 데이터가 어긋난 경우에만 나오는
      상태이며, 환불 없이 결제만 반려로 종결하는 경로는 두지 않는다. 재실행은 요청자로 막는다 — 그 결제에
      요청자가 시스템인 환불이 이미 있으면 금액을 다시 계산하지 않고 그것을 돌려준다.
      회원 입장에서는 결제가 실패한 것으로 보인다. 돈이 잠깐 빠졌다 돌아온다.
      그래서 회원에게 환불 내역을 보여줄 때는 이것을 제외한다.

  - term: 결제사
    definition: 우리가 승인·취소·이력 조회를 요청하는 상대. 전자지급결제대행 라이선스를 가진 곳이다.
    code_identifier: PaymentPg
    notes: >
      어휘를 하나로 쓴다 — 값으로 담을 때는 pg, 그쪽에서 온 값에는 pg 접두어를 붙인다
      (그 상대가 누구인지 / 그 상대가 준 값인지). 패키지 경로도 infrastructure/pg/<결제사>/ 다.
      간편결제 브랜드(지갑)와 다르다. 지갑은 결제사를 통해 들어오지 우리가 직접 부르지 않는다 —
      우리가 API로 부르는 상대는 언제나 라이선스를 가진 곳이다.
      결제사 전용 타입에 대한 의존은 인프라 안에서만 나온다. 도메인은 이 enum 값으로만 어느 곳인지 안다.
      이름 자체는 승인 복귀 진입점에도 남는데, 그 경로는 결제사가 정하는 규격이라 우리가 고를 수 없다.

  - term: 결제 시도
    definition: 결제창을 한 번 띄워 승인까지 가려는 시도 하나. 실패하거나 중단돼도 행으로 남는다.
    code_identifier: Payment
    notes: >
      한 주문에 여러 건 존재할 수 있다. 결제사 호출 전에 만들어지므로 결제사 발급 번호가
      아직 없는 상태로 시작한다.

  - term: 환불 사건
    definition: '"얼마를 왜 돌려준다"는 의도 하나. 판정과 한도 계산이 기대는 금액의 정본이다.'
    code_identifier: Refund
    notes: >
      한 결제에 여러 건 존재할 수 있다. 시도가 여러 번 실패해도 사건은 하나로 유지된다.
      문서에서 "환불 의도"라고 쓰는 것이 이것이다 — 아직 결제사를 부르지 않은 사건을 가리킬 때 그렇게
      부르지만 다른 것이 아니다. 새 이름을 만들지 말고 둘 중 문맥에 맞는 쪽을 쓴다.

  - term: 결제사 호출
    definition: 결제사에 요청을 한 번 던지는 일. 같은 멱등키로 다시 던져도 호출은 그때마다 하나씩 는다.
    code_identifier: PgCallLog
    notes: >
      "시도"와 다르다. 시도는 멱등키 하나에 대응하고, 호출은 그 키를 실어 보낸 한 번을 가리킨다.
      한 시도에 호출이 여럿 속할 수 있다 — 응답을 못 받아 같은 키로 다시 보내면 시도는 그대로이고
      호출만 는다. 그래서 호출 기록에는 같은 멱등키의 행이 여럿 쌓인다.
      이 둘을 섞으면 "몇 번 시도했나"가 "몇 번 불렀나"에 묻혀 이중환불 판정이 흔들린다.

  - term: 환불 시도
    definition: 한 환불 사건에서 멱등키 하나로 묶이는 단위. 결제사가 그 키로 중복을 걸러 주는 범위다.
    code_identifier: Refund.attemptSeq
    notes: >
      결제 시도와 담기는 모양이 반대다. 결제는 시도마다 새 행이 생기지만, 환불은 사건 행 하나가
      유지되고 그 안에서 시도 번호가 오른다. 사건이 하나로 유지되어야 한도 계산이 흔들리지 않기 때문이다.
      새로운 시도가 될 때마다 시도 번호가 올라 결제사 호출 멱등키가 새 값이 되고, 사건 키에 그 번호를
      붙인 환불 시도 키를 보낸다. 같은 시도를 다시 보낼 때는 번호도 키도 그대로다.
      한 번의 시도가 실패해도 사건이 실패로 끝나는 것은 아니다.
      시도의 정본은 환불 사건이 든 시도 번호이지 호출 기록이 아니다. 기록은 별도 트랜잭션이라 전이는
      커밋됐는데 행이 아직 없는 순간이 있고, 애초에 한 시도에 행이 여럿 생긴다.

  - term: 승인 시도 번호
    definition: 그 결제의 승인이 지금 몇 번째 시도인가. 승인 호출 멱등키에 붙는 번호다.
    code_identifier: Payment.attemptSeq
    notes: >
      부른 횟수가 아니다 — 결과를 모를 때는 같은 키로 다시 부르므로 오르지 않는다.
      오르는 자리가 둘이다 — 첫 호출(부르기 직전), 다시 시도할 수 있는 실패를 반영하는 자리.
      그 밖에는 오르지 않는다. 환불에는 사람이 되살리는 세 번째 자리가 있지만 결제에는 없다.
      "마지막으로 부른 시각"과 짝이 아니다. 그쪽은 호출이 나갈 때마다 덮어쓰고 이쪽은 위 둘에서만 오른다.
      대사 시도 횟수와도 다르다 — 이쪽은 결제사에 시킨 것이고 그쪽은 대사가 집은 것이다.
      이력 조회가 거절된 주기에는 재요청을 못 하므로 그쪽만 오른다.
      환불 시도 번호와 뜻이 같지만 쓰는 데가 좁다 — 환불은 그 값을 이력에 실어 보내 시도를 가리는 데도
      쓰고, 승인은 결제사가 결제 번호 하나로 판단해 그럴 일이 없다.

  - term: 환불 시도 번호
    definition: 그 환불 사건이 지금 몇 번째 시도인가. 환불 시도 키와 결제사 호출 멱등키에 붙는 번호다.
    code_identifier: Refund.attemptSeq
    notes: >
      승인 시도 번호와 뜻은 같지만 오르는 자리가 하나 더 많다. 셋이다 — 첫 발송(0 → 1),
      다시 시도할 수 있는 실패를 반영하는 자리, 그리고 사람이 검토 상태에서 되살리는 자리.
      마지막 것이 결제에는 없다. 되살릴 때 이 값이 안 오르면 직전 실패와 같은 키가 그대로 나가,
      결제사가 그 키를 기억하면 무엇을 고쳐도 이전 실패 응답만 되돌아온다.
      0이면 한 번도 부르지 않은 건이라는 뜻이고 그때는 확인할 이력이 없다.
      재전송에 상한이 없으므로 이 값으로 멈출지를 판정하지 않는다.

  - term: 환불 사유
    definition: 그 환불이 왜 생겼는가. 값이 정해진 목록이며 자유 문자열이 아니다.
    code_identifier: RefundReason
    notes: >
      집행 여부를 정하지 않는다 — 대사는 환불 행이 있으면 집행한다. 행이 만들어지는 자리가 정당한
      조건과 같은 트랜잭션이라 부당한 행이 아예 생기지 않기 때문이다.
      쓰이는 곳은 회원에게 보여줄 때 승인 반려 건을 거르는 것과, 무슨 일이 있었는지 되짚는 것이다.
    values:
      - ORDER_CANCELED : 회원이 주문을 취소했다
      - APPROVAL_REJECTED_ORDER_CANCELED : 취소된 주문에 승인이 들어와 반려한다
      - APPROVAL_REJECTED_AMOUNT_MISMATCH : 승인 금액이 우리 기록과 달라 반려한다

  - term: 결제 종결 코드
    definition: >
      결제가 성공하지 못한 채 끝난 이유. 상태가 종결의 종류를 말하고 이 값이 왜를 말한다.
    code_identifier: PaymentCloseCode
    notes: >
      세 종결 상태의 값이 서로 겹치지 않아 종결 코드만 봐도 어느 쪽인지 안다.
      환불 검토 코드와 목록을 나눠 갖는다 — 한 목록을 공유하면 값의 절반이 서로에게 의미가 없다.
      자세한 뜻은 data-model의 "결제의 종결 코드" 표에 있다.
    values:
      - PG_DECLINED : 결제사가 승인을 거절했다 (FAILED)
      - PG_UNAVAILABLE : 결제사 점검·장애로 승인이 안 됐다 (FAILED)
      - PAYMENT_KEY_MISMATCH : 결제 키가 그 결제의 것이 아니다 (FAILED)
      - UNCONFIRMED_CLOSED : 승인 가능 시간이 지났다는 결제사의 답으로 확정했다 (FAILED)
      - EXTERNALLY_CANCELED : 승인은 났는데 우리가 모르는 경로로 취소됐다 (FAILED)
      - AMOUNT_MISMATCH : 승인 금액이 우리 주문 금액과 다르다 (REJECTED)
      - ORDER_NOT_PAYABLE : 주문이 결제 가능한 상태가 아니다 (REJECTED)
      - SUPERSEDED : 새 결제 요청이 자리를 뺏었다 (EXPIRED)
      - SESSION_TIMEOUT : 세션이 지나 만료 배치가 정리했다 (EXPIRED)

  - term: 환불 검토 코드
    definition: >
      환불이 자동으로 더 진행할 수 없게 된 이유. 이 값이 채워졌다는 것이 곧 MANUAL_REVIEW다.
      환불에는 실패로 끝나는 종착이 없으므로 "종결"이 아니라 "검토"라고 부른다 — 사람이 이어받는다.
    code_identifier: RefundReviewCode
    notes: >
      결제의 종결 코드와 목록을 나눠 갖는다 — 한 목록을 공유하면 값의 절반이 서로에게 의미가 없다.
      값마다 돈이 나갔는지가 달라, 관리자가 성공으로 정리할지 다시 보낼지를 이것으로 가른다.
    values:
      - CANCEL_DEADLINE_EXPIRED : 취소 기한이 지나 결제사로는 못 돌려준다 (돈 안 나감)
      - CANCEL_NOT_ALLOWED : 할인 정책 등으로 이 결제는 취소할 수 없다 (돈 안 나감)
      - REFUNDABLE_AMOUNT_EXCEEDED : 환불 가능 금액을 초과했다 (돈이 나갔는지 모름)
      - REQUEST_REJECTED : 우리가 보낸 값이 결제사 기준에 맞지 않는다 (돈 안 나감)

  - term: 결제사 호출 기록
    definition: 결제사를 부른 사실 하나. 승인 호출과 환불 호출을 한 곳에 쌓는다.
    code_identifier: PgCallLog
    notes: >
      쌓기만 하고 고치지 않는다. 판정에 쓰지 않는다. 응답 원본을 그대로 담는다 —
      결제사마다 응답 모양이 다르고 실패 응답에는 명세의 응답 표에 없는 항목이 실려 오기 때문이다.
      이력 조회는 담지 않는다. 상태를 바꾸려는 요청이 아니라 확인이고, 섞으면 몇 번 시도했는지가
      조회 횟수에 묻힌다.

  - term: 승인 금액
    definition: 결제사가 실제로 승인한 금액. 한도 계산의 기준이다.
    code_identifier: approvedAmount
    notes: >
      결제 행의 금액과 다르다. 그쪽은 결제를 시작할 때 복사해 둔 주문 금액이다. 둘이 어긋날 수 있고,
      되돌릴 금액은 결제사가 승인한 쪽이다. 승인 응답을 받아 확인한 시점에 채우며, 그 결제를 성공으로
      인정하는지와 무관하다 — 그래서 결제가 실패인데 이 값이 채워진 행이 정상으로 존재한다.

  - term: 승인 가능 시간
    definition: 결제사가 발급한 결제 번호로 승인을 요청할 수 있는 시간. 회원이 결제창에서 인증을 마친 때부터 재며, 네이버페이는 10분으로 둔다.
    notes: >
      결제사가 정하고 결제사가 판정한다. 지나서 부르면 "승인 가능 시간이 지났다"는 결과 코드로 답한다.
      우리가 재는 값이 아니라는 것이 중요하다 — 우리 시계와 결제사 시계가 어긋나도, 회원이 결제창에
      얼마나 머물렀는지 몰라도 판정이 흔들리지 않는다.
      값이 코드에도 설정에도 들어가지 않으므로 결제사마다 달라도 바꿀 곳이 없다. 새 결제사에 필요한
      것은 그 결제사의 어느 결과 코드가 이 답에 해당하는지를 어댑터가 접는 것뿐이다.
      대사가 결제를 실패로 확정하는 유일한 근거가 그 답이다. 그전까지는 이력이 비어 있어도, 이번
      요청이 실패했다는 답을 받아도 확정하지 않는다 — 이번 호출에 대한 답이지 이미 나갔을 수 있는
      앞선 호출에 대한 답이 아니기 때문이다.
      요청 흐름의 첫 승인 호출은 다르다. 앞선 호출이 없어 그 창이 없으므로 실패 답을 그 자리에서
      종결로 받는다.

  - term: 환불 사건 키
    definition: 환불 사건 하나를 가리키려고 환불 도메인이 발급하는 식별자.
    code_identifier: refundKey
    notes: >
      끝까지 바뀌지 않는다. 결제사에 보낼 때는 이 값에 시도 번호를 붙인 "환불 시도 키"를 만들어
      싣는다 — 아래 항목을 보라. 이력에서 우리 사건을 집어내는 근거가 되며, 아래 "환불 요청 멱등키"와
      다르다 — 이것은 사건을 가리키고, 저것은 같은 요청이 두 번 오는 것을 막는다.

  - term: 환불 시도 키
    definition: 환불 한 번의 시도를 가리키는 값. 환불 사건 키에 시도 번호를 붙여 만들며, 결제사에 이 값을 보낸다.
    code_identifier: refundAttemptKey
    notes: >
      결제사 요청의 가맹점 거래 키 자리에 싣는다. 결제사 필드 이름은 어댑터 안에만 두고 도메인은
      이 이름으로 부른다. 실측 결과 이 값이 환불 이력 항목에 그대로 되돌아오므로, 나중에 이력을 읽어
      우리 환불을 집어낼 수 있다.
      사건 키를 그대로 보내지 않는 이유는 한 사건을 여러 번 보낼 수 있기 때문이다. 같은 값이 여러 줄이면
      어느 시도가 나갔는지 구분되지 않는다.
      예를 들어 사건 키가 RF-a1b2c3이면 시도마다 RF-a1b2c3:1 · RF-a1b2c3:2 를 보낸다.
      이력에서 찾을 때는 구분자까지 포함한 접두어(RF-a1b2c3:)로 맞춘다 — 구분자를 빼면 다른 사건 키의
      앞부분과 겹쳐 남의 항목을 집는다.
      한 사건의 시도 둘이 모두 완료로 있으면 돈이 두 번 나간 것이며, 그것이 이 자리에서 드러난다.
      결제 쪽 "결제 키"와 다르다 — 그쪽은 결제 시도를, 이쪽은 환불 시도를 가리킨다.

  - term: 결제 키
    definition: 결제 한 번의 시도를 가리키는 값. 우리가 발급해 결제사에 보낸다.
    code_identifier: paymentKey
    notes: >
      결제 시도마다 새로 발급하며, 결제 행 하나가 시도 하나이므로 행마다 하나씩 있다.
      승인 요청이 그 회원의 것인지 확인할 때 회원 식별자와 함께 좁혀 찾는 값이기도 하다.
      결제창에서 돌아오는 주소에 실려 있어 비밀에 기댈 수 없다.
      결제사가 발급하는 번호는 따로 있고 승인 인증 뒤에 채워진다.

  - term: 부른 시각
    definition: 결제사에 그 호출을 던진 시각. 결제사 호출 기록에만 있다.
    code_identifier: PgCallLog.requestedAt
    notes: >
      문서 전체에서 이 한 이름으로 쓴다 — "요청 시각"·"물음을 던진 시각" 같은 다른 표기를 섞지 않는다.
      한 행이 한 호출이므로 행이 만들어진 뒤 바뀌지 않는다.
      대사 판정에는 쓰지 않는다. 언제 그 건을 집을지는 결제·환불 행이 든 "마지막으로 부른 시각"과
      "마지막으로 대사가 집은 시각"으로 재며,
      호출 기록을 조인해 읽으면 대사 스캔이 인덱스를 못 타고 매 주기 전체를 훑게 된다.
      조사할 때는 이 값을 본다 — 어느 시도를 언제 보냈는지가 여기 남는다.

  # 대사가 쓰는 시각 셋. 셋 다 "마지막으로 무엇을 한 시각"이고 NULL은 "아직 안 했다"는 뜻이다.
  # 정책이 정한 유예를 미리 계산해 넣지 않는다 — 사실만 담고 판정은 조회가 한다.
  # 그래야 유예 값을 바꿀 때 이미 저장된 행이 옛 값을 들고 남지 않는다.

  - term: 마지막으로 부른 시각
    definition: 결제사에 승인이나 환불을 마지막으로 요청한 시각.
    code_identifier: lastRequestedAt
    notes: >
      부르기 직전 커밋에서 찍으며 부를 때마다 갱신된다 — 같은 키로 다시 불러도 찍는다.
      시도 번호와 짝이 아니다. 그쪽은 새로운 시도를 셀 뿐이고 이쪽은 호출이 나갈 때마다 덮어쓴다.
      응답 대기 상태의 대사 유예를 이 값으로 잰다 — 요청 흐름이 아직 응답을 기다리는 중일 수 있어
      그만큼 기다렸다 집는다. 그 상태면 반드시 값이 있으므로 조회에서 NULL을 볼 일이 없다.
      생성 시각으로 대신할 수 없다. 결제는 회원이 결제창에 머문 시간이 섞이고, 환불은 재시도가 같은
      행을 다시 지나 첫 의도를 저장한 시각에 머물러 있다.

  - term: 마지막으로 대사가 집은 시각
    definition: 대사가 그 건을 마지막으로 집은 시각. 확정했든 못 했든 남긴다.
    code_identifier: lastReconcileAt
    notes: >
      NULL은 아직 안 집었다는 뜻이라 바로 대상이 된다. 결과 불명 상태에 대사 유예를 따로 두지 않는
      이유가 그것이다 — 결과를 모르는 건은 빨리 읽어 확정해야 한다.
      확정에 실패한 건을 매 주기 다시 읽지 않게 누른다. 확정에 성공하면 상태가 바뀌어 그 상태의 조건이
      다시 막지만, 실패하면 아무것도 안 막는다. 없으면 결제사 장애가 길어질수록 우리가 더 세게 두드린다.
      다시 집는 간격이 회차마다 벌어지므로 대사 시도 횟수와 짝으로 쓴다 — 이 값 하나로는 언제 다시 집을지가
      정해지지 않는다.
      재전송의 백오프도 이 값이 받는다 — 다시 보내는 것은 대사가 이력을 읽은 그 자리에서 하므로,
      읽기를 누르는 것이 곧 전송을 누르는 것이다.

  - term: 마지막으로 알린 시각
    definition: 그 건을 운영자에게 마지막으로 통지한 시각.
    code_identifier: lastNotifyAt
    notes: >
      통지를 보낸 뒤에 찍는다. 먼저 찍고 보내면 전송이 실패했을 때 알린 것으로 남아 다시 알리지 않는다.
      "승급한 시각"이 아니다 — 반복 통지마다 갱신되므로 담는 것은 마지막 통지 시각이고, 언제부터
      알리기 시작하는지는 생성 시각과 정책 값이 정한다.
      NULL은 아직 안 알렸다는 뜻이고, 반복 간격을 이 값으로 잰다.
      맞추려고 이 값을 지우지 않는다. 지우면 "마지막으로 알린 때"라는 뜻이 거짓이 된다.

  - term: 대사 시도 횟수
    definition: 대사가 그 건을 몇 번 집어 처리했는지 세는 값.
    code_identifier: reconcileCount
    notes: >
      결제 행과 환불 행에 각각 담기고 뜻이 같다. 다시 집는 간격이 회차마다 벌어지므로 그 간격을 고르는 데
      쓰며, 확정했든 못 했든 집을 때마다 올린다.
      "이력을 몇 번 읽었나"가 아니다 — 대사 한 주기는 조회로 끝날 수도 있고 그 자리에서 다시 부르는
      데까지 갈 수도 있는데, 그 둘을 가리지 않고 한 주기를 하나로 센다.
      시도 번호와 세는 대상이 다르다 — 그쪽은 결제사에 무언가를 시킨 횟수(승인·환불)이고 이쪽은 대사가
      집은 횟수다. 대사가 집었어도 못 보내는 주기가 있고, 보내더라도 결과를 모를 때는 같은 키라 시도 번호가
      오르지 않아 둘이 함께 움직이지 않는다 — 이력 조회가 거절되거나, 같은 결제의 다른 환불에 밀린 경우다.
      회수 횟수의 상한이 아니다. 간격표를 다 쓰면 마지막 값이 계속 쓰이고 회수는 멈추지 않는다.

  # 위 시각들을 판정에 쓰는 정책 값 다섯. 정책 클래스가 들고 있고 크기는 spec의 시간 값 표가 정본이다.
  # 각 값이 "무엇부터 재는가"가 다르므로 짝이 되는 시각을 함께 적는다.

  - term: 대사 유예
    definition: 결제사를 부른 뒤 그 건을 대사가 집기까지 두는 유예.
    notes: >
      "마지막으로 부른 시각"부터 잰다. 막으려는 것은 요청 흐름이 아직 그 호출을 쥐고 있는 동안 대사가
      같은 건을 집는 것이다. 결제와 환불의 크기가 갈리는데, 겹쳤을 때 치르는 대가가 달라서다 —
      환불은 겹쳐 전송되면 같은 취소가 두 번 나가고 결제는 "이미 진행 중"으로 막힌다.
      결과 불명 상태에는 이 유예를 두지 않는다. 요청 흐름이 이미 끝났다는 것이 그 상태에 담겨 있다.

  - term: 다시 집는 간격
    definition: 대사가 같은 건을 다시 집기까지 두는 간격. 회차마다 벌어진다.
    notes: >
      "마지막으로 대사가 집은 시각"과 "대사 시도 횟수"를 함께 봐서 고른다 — 횟수로 간격표에서 값을
      고르고 시각에 더해 다음 시점을 낸다. 간격을 미리 계산해 저장하지 않는 이유가 이것이다.
      상한이 있어 표를 다 쓰면 마지막 값이 계속 쓰인다. 회수가 멈추는 것이 아니다.

  - term: 통지 승급
    definition: 정상 범위를 벗어났다고 보고 운영자에게 처음 알리기까지 두는 시간.
    notes: >
      "만들어진 시각"부터 잰다 — 부른 시각이 아니다. 결제 행은 결제창을 띄우기 전에 만들어져
      회원이 결제창에 머문 시간까지 포함되므로 여유를 둔다.
      "마지막으로 알린 시각"은 이 판정에 쓰지 않는다. 그쪽은 반복 통지마다 갱신되므로 첫 알림의
      기준이 될 수 없다.

  - term: 통지 반복 간격
    definition: 이미 알린 건을 다시 알리기까지 두는 간격.
    notes: >
      "마지막으로 알린 시각"부터 잰다. 더 짧으면 무시되고 더 길면 놓친다.
      해결되면 상태가 바뀌어 대상에서 빠지므로 저절로 멈춘다.

  - term: 만료 임계
    definition: 승인을 한 번도 부르지 않은 결제를 배치가 종결하기까지 기다리는 시간.
    notes: >
      "만들어진 시각"부터 잰다. 결제창 세션보다 넉넉해야 한다 — 우리 결제 행이 결제사 예약 번호보다
      먼저 생기므로, 세션과 같은 크기로 잡으면 회원이 아직 쓸 수 있는 결제창의 행을 종결한다.
      승인을 부른 뒤의 행은 이 배치가 건드리지 않는다. 돈이 나갔을 수 있기 때문이다.

  - term: 결제 시작 멱등키
    definition: 밖에서 온 결제 시작 요청 하나를 가리키려고 호출자가 정해 넘기는 값. 같은 값이 두 번 오면 같은 요청으로 본다.
    code_identifier: idempotencyKey
    notes: >
      유일 범위는 그 회원 안이다 — 결제로 묶을 수 없고(그 결제가 아직 없다), 주문으로 묶으면 같은
      주문을 다시 결제하는 정상 재시도가 막힌다. 주문 생성이 이미 회원 단위를 쓴다.
      기존 결제를 찾을 때도 회원과 함께 좁힌다. 막는 범위와 찾는 범위가 어긋나면, 값의 형식을
      제한하지 않으므로 다른 회원이 같은 문자열을 보내 남의 결제를 돌려받는다.
      같은 값에 내용(주문·금액)이 다른 요청이 오면 거부한다. 앞서 만든 결제를 그대로 돌려주면
      다른 주문을 결제하려던 요청에 앞 주문의 결제창 값이 나가 엉뚱한 주문이 결제된다.
      아래 "환불 요청 멱등키"와 이름이 같고 유일 범위가 다르다(회원 / 결제). 이름을 같게 두는 것은
      주문이 이미 같은 이름·같은 범위로 쓰고 있어서다. 다만 **한 메서드 안에 둘이 같이 보이는 자리에서는
      인자 이름을 갈라 쓴다** — 둘 다 문자열이라 잘못 넘겨도 드러나지 않는다.

  - term: 환불 요청 멱등키
    definition: 밖에서 온 환불 요청 하나를 가리키려고 호출자가 정해 넘기는 값. 같은 값이 두 번 오면 같은 요청으로 본다.
    code_identifier: idempotencyKey
    notes: >
      유일 범위는 그 결제의 그 요청자 안이다 — 기존 사건을 찾는 범위가 그 결제에 딸린 환불들이므로
      제약도 같게 두고, 요청자가 함께 드는 것은 회원 값과 시스템 값의 신뢰 경계가 다르기 때문이다.
      유일 제약이 걸려 동시에 같은 키가 들어와도 사건은 하나만 생긴다. 결제사에는 보내지 않는다.
      회원의 주문 취소는 이 값을 요청 헤더로 받는다.
      시스템이 만드는 환불은 사유 값이 이 자리를 채운다. 비워 두면 유일 검사에서 빠져 DB가 중복을
      막지 못하고, 고정 문자열 하나로 두면 사유가 늘 때 두 번째 종류가 조용히 안 만들어진다.
      서버가 회원 경로에서 파생하지 않는 이유는 같은 결제에서 늘 같은 값이 나와, 실패로 끝난 뒤
      다시 환불할 때 막히고 같은 결제의 두 경로 환불이 수렴하기 때문이다.
      요청자의 소유는 결제를 그 회원의 것으로 좁혀 로드하는 데서 이미 보장되므로 이 값으로 다시
      대조하지 않는다.

  - term: 환불 요청자
    definition: 그 환불을 누가 요청했는가. MEMBER(회원의 주문 취소) 또는 SYSTEM(승인 반려)이다.
    code_identifier: RefundRequester
    notes: >
      결제사 취소 요청의 필수 필드라 반드시 실어야 한다. 어댑터가 결제사 값(구매자 / 가맹점 관리자)으로
      옮기며, 도메인은 이 두 값만 안다.
      환불이 태어날 때 정해지고 끝까지 바뀌지 않는다. 누가 요청했는가이지 누가 그 호출을 보냈는가가
      아니다 — 회원이 취소한 환불을 대사가 재전송해도 MEMBER 그대로다. 이 값이 흔들리면 아래 유일
      범위가 옮겨 가, 회원이 같은 요청 키로 다시 요청할 때 기존 사건을 못 찾고 새 환불이 생긴다.
      환불 요청 멱등키의 유일 범위에 함께 든다 — 회원 값과 시스템 값은 신뢰 경계가 달라, 한 공간에 두면
      회원이 시스템 값과 같은 문자열을 보내 내부 제약을 건드릴 수 있다.
      승인 반려의 재실행을 "이 결제에 SYSTEM 환불이 이미 있나"로 가른다(반려는 결제당 한 건이다).
      환불 사유와 다른 축이다 — 사유는 왜 생겼는가이고 이것은 누가 요청했는가다. 사유는 값이 늘 수
      있지만 이것은 둘로 고정된다.

  - term: 결제사 호출 멱등키
    definition: 한 번의 호출이 중복 전송되는 것을 결제사가 막게 하는 값. 결과를 모르는 동안은 이 값을 그대로 다시 보내 결과를 회수한다.
    code_identifier: pgIdempotencyKey
    notes: >
      문서에서 앞말 없이 "멱등키"라고 쓸 때는 이것을 가리킨다. 위 둘("결제 시작 멱등키"·"환불 요청
      멱등키")과 다르다 — 이것은 우리가 만들어 결제사에 보내고, 저 둘은 호출자가 만들어 우리에게 보낸다.
      셋의 범위는 이렇게 갈린다.
        결제 시작 멱등키   회원 안에서 유일        밖 → 우리     Payment.idempotencyKey
        환불 요청 멱등키   결제·요청자 안에서 유일  밖 → 우리     Refund.idempotencyKey
        결제사 호출 멱등키 전체에서 유일          우리 → 결제사  pgIdempotencyKey
      환불 쪽에 요청자가 함께 드는 것은 회원이 보낸 임의 문자열과 시스템이 채우는 사유 값이 같은
      자리를 다투지 않게 하려는 것이다. 빼면 회원이 사유 값과 같은 문자열을 보내 승인 반려 환불이
      만들어지지 못하게 막을 수 있다.
      값이 바뀌는 것은 다시 시도할 수 있는 실패를 받았을 때뿐이다. 응답을 못 받았거나 이력에 없거나
      이력에 실패로 있는 동안은 같은 값을 그대로 보낸다 — 새 값으로 보내면 이미 나간 요청 위에
      하나가 더 실행될 수 있기 때문이다.
      두 환불이 같은 값을 가질 수 없다 — 사건 키에 시도 번호를 붙여 만들므로 겹치는 것은 새 시도인데
      시도 번호를 안 올린 코드 버그일 때뿐이고, 그대로 두면 다른 환불의 결과를 이 환불의 결과로 읽는다.
      결제사가 이 값을 얼마나 보관하는지 알 수 없다. 그 전제 위에 서는 자리는 하나뿐이다 —
      처리가 끝났는데 이력 반영이 아직 안 된 건을 같은 값으로 부르는 경우다.

  - term: 이력
    definition: 한 결제에 일어난 승인·취소를 결제사가 시간순으로 돌려주는 목록.
    caveat: >
      이력 항목의 "취소"는 결제사 어휘다. 우리 도메인에서 그것은 "환불"이며, 용어집 맨 위의 "취소"
      (주문을 무르는 것)와 다른 말이다. 요구 문장에서 이력 항목을 가리킬 때는 그 점을 밝힌다.
    code_identifier: history
    notes: >
      "결제사 호출 기록"과 다르다 — 그쪽은 우리가 부른 사실을 우리가 쌓는 것이고, 이것은 결제사가
      가진 사실이다. 결과를 모를 때 확정하는 근거이며, 우리 환불 시도 키가 실린 항목으로 우리 사건을
      집어낸다. 우리 기록에 없는 취소 항목이 보이면 우리가 모르는 환불이 있다는 뜻이다.

  - term: 집행
    definition: 저장해 둔 환불 의도를 실제로 결제사에 보내 돈을 돌려주는 일.
    code_identifier: execute
    notes: >
      환불 의도를 저장하는 것과 나뉜다. 의도는 주문 취소와 함께 커밋되고 집행은 그 뒤에 일어난다.
      환불 행이 있으면 집행한다. 정당성을 다시 확인하지 않는다.

  - term: 환불 가능 금액
    definition: 결제사 기준으로 그 결제에 아직 취소할 수 있는 금액.
    notes: >
      우리가 계산하는 "한도"와 다르다 — 이것은 결제사가 가진 값이다. 우리 요청이 이 값을 넘으면
      결제사가 거절하며, 그 거절은 대조 옵션과 무관하게 항상 작동한다. 과다 환불을 결제사가 막아 주는
      근거가 이것이다.
      우리 쪽에 코드 이름이 없다 — 취소 성공 응답에 실려 오지만 읽지도 저장하지도 않기로 했다.
      우리 한도와 맞대어 보는 자리도 없다.

  - term: 한도
    definition: 그 결제에 더 환불할 수 있는 금액.
    code_identifier: (이름을 두지 않는다 — 결제의 판정 메서드 안에서만 쓰인다)
    notes: >
      승인 금액에서 누적 환불액을 뺀 값이다. 어디에도 저장하지 않고 판정할 때 계산한다.
      값으로 꺼내 두면 그것을 읽고 판정하는 코드가 밖에 생기고, 그러면 판정이 도메인 밖으로 샌다.

  - term: 누적 환불액
    definition: 그 결제에 딸린 모든 환불 사건의 금액 합. 결제 행이 들고 있다.
    code_identifier: totalRefundedAmount
    notes: >
      상태로 예외를 두지 않는다 — 결과를 모르는 환불도 사람이 이어받은 환불도 다 더한다.
      돈이 나갔을 가능성이 있는 것을 전부 세어 과하게 나가지 않게 한다.
      환불을 만드는 트랜잭션이 여기에 더하고, 그 갱신이 결제 행을 바꾸므로 낙관 락이 걸린다.
      환불 상태가 바뀔 때는 변하지 않는다 — 금액의 합이지 상태의 함수가 아니다.
      이름에 total 을 붙인 것은 아래 "이번 환불 금액" 과 뜻이 반대이기 때문이다.

  - term: 이번 환불 금액
    definition: 한 번의 취소 요청으로 되돌리는 금액. 주문 취소 응답이 회원에게 보여주는 값이다.
    code_identifier: refundedAmount
    notes: >
      누적 환불액과 이름이 비슷하지만 뜻이 반대다 — 그쪽은 그 결제의 모든 환불 합이고
      이쪽은 이번 건 하나다. 전액환불만 있는 지금은 두 값이 우연히 같아 어긋남이 드러나지 않고,
      부분환불이 오는 순간 갈린다. 결제 행의 값을 그대로 응답에 옮기지 않는다.

  - term: 결과 회수
    definition: 결과를 모르는 결제·환불의 실제 결과를 결제사 이력으로 알아내 확정하는 것.
    code_identifier: reconcile
    notes: >
      아래 "결제 회수"와 우리말이 겹친다. 문맥이 "결과를 모르는 건"이면 이쪽이다.

  - term: 결제 회수
    definition: >
      남의 승인 응답으로 드러난 결제를 그 주인의 결제 행에 붙이는 것. 번호를 심고 결과 불명으로 두어
      대사에 넘긴다.
    code_identifier: reclaim
    notes: >
      확정하지 않는다 — 주문 상태에 따라 갈리는 판정은 승인 확정 흐름의 몫이다.
      위 "결과 회수"와 우리말이 겹치므로, 문서에서 둘이 한 문단에 나오면 어느 쪽인지 밝혀 쓴다.

  - term: 환불 사건을 연다
    definition: 결제가 한도를 판정해 새 환불 사건을 만들거나, 같은 요청의 기존 사건을 돌려주는 것.
    code_identifier: openRefund / openRejectionRefund (둘 다 Refund.open 관문을 통한다)
    notes: >
      "연다"는 사건이 시작된다는 뜻이며, 그 사건이 결제사에 나가는 시도를 여럿 낳는다.
      다시 보낼 준비로 새 시도를 만드는 것은 이 말을 쓰지 않는다 — 사건은 그대로 두고 시도 번호만
      올리며, 그 자리의 이름은 recordRetryableFailure다.

  - term: 남은 취소 가능 금액
    definition: 그 결제에서 앞으로 더 취소할 수 있는 금액. 승인 금액에서 누적 환불액을 뺀 값이다.
    code_identifier: remainingAmount
    notes: >
      환불 한도와 같은 축·같은 계산이다. 그래서 이 값이 0이 아니면 그만큼 더 취소할 수 있다는 뜻이고,
      프론트가 "취소 가능 금액"으로 그대로 쓴다.
      "아직 안 돌아온 돈"이 아니다 — 결과를 모르는 환불도 한도를 이미 잡고 있어 여기서 빠진다.
      돈이 실제로 돌아갔는지는 환불 진행 상태가 말한다.
      기준이 주문 금액이 아니라 승인 금액인 이유는 한도를 재는 것이 그 값이기 때문이다. 둘이 다른
      결제는 반려로 종결되므로 성공한 결제에서는 같지만, 기준이 갈리면 한도는 통과하는데 응답이 0을
      말하거나 그 반대가 된다.
      결제 전 취소는 0이다 — 승인 금액이 없어 한도가 없고 그 주문은 이미 취소됐다.
      우리 계산 결과이며 결제사가 알려준 값이 아니다. 전액환불만 하는 이번 범위에서는 항상 0이지만,
      부분환불이 오면 그대로 쓸 수 있도록 지금 계약에 넣는다.
      "주문 잔여액"이라고 부르지 않는다 — 기준이 주문이 아니라 결제이고, 재는 것도 남은 돈이 아니라
      한도의 잔량이다.

  - term: 활성 슬롯
    definition: 한 주문에 진행 중인 결제가 하나뿐임을 강제하는 자리.
    code_identifier: activeOrderKey
    notes: >
      두 가지를 가려야 한다. 결제가 어느 경로로든 종결되면 그 결제가 슬롯을 비운다 —
      실패든 반려든 만료든 경로를 가리지 않는다. 반면 새 결제 요청이 기존 결제를 강제로 종결시켜 슬롯을 빼앗을 수 있는
      대상은 READY 결제뿐이다. "결제창 인증 전"이 아니라 상태로 정의한다 — 회원이 인증을 마쳤어도
      승인 요청이 우리에게 닿기 전이면 서버는 그것을 알 수 없다. 승인을 호출한 뒤의 결제를 종결하면
      그 승인이 성공했을 때 한 주문에 승인이 둘 성립하므로, 그 경우에는 종결하지 않고 새 요청을
      거절한다. 성공한 결제도 슬롯을 계속 쥔다.

  - term: 대사
    definition: 결과를 모르는 결제·환불을 주기적으로 다시 확인해 확정하는 일.
    code_identifier: reconcile
    notes: >
      정해진 시간이 지나면 운영자에게 알리되 다시 집는 것을 멈추지 않는다. 간격은 회차마다 벌어지되
      상한에서 멈춘다. 멈추면 회원이
      할 수 있는 일이 없다 — 환불은 돈이 안 돌아간 채 한도가 막히고, 승인은 활성 슬롯을 쥔 채 남아
      그 주문을 영영 결제할 수 없게 된다.
      환불은 행이 있으면 집행한다. 정당성을 다시 확인하지 않는다.
