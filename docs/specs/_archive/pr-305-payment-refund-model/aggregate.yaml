# 이 spec이 다루는 aggregate 둘. 각자 자기 루트를 통해 변경한다.
# 모델의 정본은 data-model.md다. 이 파일은 기계가 읽는 선언이며, 어긋나면 그쪽이 맞다.

# 환불을 결제 안에 두지 않는 이유: 경계가 일하는 것은 환불을 "만들 때"뿐이다. 환불 하나의 상태를
# 바꾸는 일은 한도를 바꾸지 않아(한도가 상태와 무관한 금액 합이다) 결제가 알 필요가 없다. 자식으로
# 두면 상태 하나 바꾸려고 결제와 환불 목록을 통째로 로드하게 되고, "이 변경은 한도에 참여하나"를
# 메서드마다 물어야 한다. 갈라 두면 그 물음이 사라진다.
aggregates:
  - name: Payment
    root: Payment
    purpose: >
      한 결제 시도의 승인 생명주기와 활성 슬롯을 지킨다. 그리고 환불을 만들 때 한도를 판정한다 —
      환불 총액이 결제사가 승인한 금액을 넘지 않는지는 결제만이 답할 수 있다.

    members:
      - Payment — 루트이자 유일한 구성원. 결제 시도 한 건. 승인 생명주기와 활성 슬롯,
                  결제 시작 멱등키를 갖는다
                  (그 멱등키는 Refund의 것과 이름이 같고 유일 범위가 다르다
                   — 이쪽은 회원, 저쪽은 결제와 요청자)

    invariants:
      - 같은 결제 시작 멱등키에 내용(주문·금액)이 다른 요청이 오면 거부한다 (앞서 만든 결제를 돌려주지 않는다)
      - 승인 금액은 0보다 크다 (0이면 한도가 처음부터 0이라 되돌릴 환불을 만들 수 없다)
      - 결제의 종착 상태는 되돌리지 않는다
      - 상태와 활성 슬롯이 어긋나지 않는다 — 종결되면 슬롯을 비우고 성공한 결제는 계속 점유한다.
        슬롯을 비우는 전이가 여럿이라(실패·만료·반려) 하나라도 빠뜨리면 그 주문을 다시 결제할 수 없다.
        전이마다 따로 지우지 않고 종결이라는 하나의 내부 처리를 거치게 해서 막는다

    # 결제가 판정한다. 승인 금액도 누적 환불액도 결제 행에 있어 결제를 로드하면 재료가 다 모인다.
    # 아래 cross_aggregate_invariants가 어떻게 지키는지를 정한다.
    judges:
      - 환불 총액 + 이번 금액이 결제사가 승인한 금액을 넘는지 (결제의 도메인 메서드가 판정한다)
      - 결제사가 승인한 금액이 없으면 환불을 만들 수 없다

    states: [READY, IN_PROGRESS, UNKNOWN, SUCCEEDED, FAILED, REJECTED, EXPIRED]
    transitions:
      - "(없음) -> READY : 결제 요청. 같은 주문에 READY 결제가 있으면 그것만 EXPIRED로 종결한다"
      - "READY -> IN_PROGRESS : 승인 호출 직전. 부르기 전에 따로 커밋하고, 그 커밋에 지면 부르지 않는다"
      - "READY -> UNKNOWN : 남의 승인 응답(또는 대사의 이력)으로 이 결제의 승인이 드러났다. 번호를 심고 대사에 넘긴다"
      - "READY -> EXPIRED : 새 요청이 자리를 뺏거나(즉시) 만료 배치가 정리한다. FAILED로 가지 않는다 - 승인을 부른 적이 없다"
      - "IN_PROGRESS -> SUCCEEDED | FAILED | UNKNOWN : 승인 응답에 따라"
      - "IN_PROGRESS -> SUCCEEDED | FAILED : 대사가 이력을 읽어 확정. 응답을 끝내 못 받은 건이다"
      - "UNKNOWN -> SUCCEEDED | FAILED : 대사가 결과를 확인해 확정"
      - "IN_PROGRESS | UNKNOWN -> REJECTED : 승인이 났음을 확인했는데 우리가 받아들일 수 없다. 환불 생성과 한 저장이다"
      - "IN_PROGRESS | UNKNOWN -> FAILED : 이력에 승인과, 우리 것이 아닌 성공한 취소가 함께 있다. 돈이 이미 돌아갔으므로 환불을 만들지 않는다"
    # 슬롯을 빼앗을 수 있는 대상은 READY뿐이다(상태로 정의한다 — 서버는 인증 여부를 모른다).
    # IN_PROGRESS·UNKNOWN 결제가 있으면 종결하지 않고 새 결제 요청을 거절한다 — 진행 중인 승인이
    # 슬롯을 반납하면 그 승인이 성공했을 때 한 주문에 승인이 둘 성립한다.

    access_rule: mutate-through-root, read-may-bypass

  - name: Refund
    root: Refund
    purpose: >
      환불 사건 하나의 생명주기를 지킨다. "얼마를 왜 돌려준다"는 의도이자 판정과 한도 계산이 기대는 금액의 정본이다.

    members:
      - Refund — 루트이자 유일한 구성원. 금액·사유·요청자·현재 멱등키·시도 번호·상태와
                 대사가 쓰는 시각들을 갖는다

    invariants:
      - 환불 금액은 0보다 크다
      - 환불 요청 멱등키는 요청자를 가리지 않고 있어야 한다 (시스템 환불은 사유 값이 그 자리를 채운다)
      - 환불의 성공은 되돌리지 않는다 (MANUAL_REVIEW는 종착이 아니라 사람이 처리한다)
      - 환불 사건 키는 결제사에 환불을 요청하기 전에 정해진다

    # 첫 상태 이름이 결제와 다르다 — 결제의 READY는 회원이 결제창에서 인증하기를 기다리는 상태라
    # 서버가 대신 할 일이 없고, 환불의 REQUESTED는 요청이 접수돼 우리가 보낼 차례라 대사가 집어
    # 보낸다. 같은 이름을 쓰면 "왜 대사가 한쪽만 집나"를 문단으로 해명해야 한다.
    # IN_PROGRESS는 둘 다 같은 뜻이다 — 부르고 응답을 기다린다.
    # EXPIRED는 결제에만 있다 — 환불은 포기할 수 없어 "안 부른 채 끝남"이라는 종착이 존재하지 않는다.
    # 양쪽 다 첫 상태는 첫 호출 전이다. 다시 보낼 때 상태를 되돌리지 않는다 —
    # 시도 번호가 오르는 자리는 data-model.md가 정하며, 결과를 모르는 동안은 오르지 않는다.
    states: [REQUESTED, IN_PROGRESS, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
    transitions:
      - "(없음) -> REQUESTED : 환불 의도 저장. 이때 결제가 한도를 판정한다"
      - "REQUESTED -> IN_PROGRESS : 결제사 호출 직전"
      - "IN_PROGRESS -> SUCCEEDED | MANUAL_REVIEW | UNKNOWN : 결제사 응답에 따라"
      - "IN_PROGRESS -> SUCCEEDED | MANUAL_REVIEW : 대사가 이력을 읽어 확정. 응답을 끝내 못 받은 건이다"
      - "UNKNOWN -> SUCCEEDED | MANUAL_REVIEW : 이력을 읽어 확정"
      - "MANUAL_REVIEW -> SUCCEEDED : 사람이 다른 수단으로 돌려줬다 (이번 범위에 일으킬 주체가 없다)"
      - "MANUAL_REVIEW -> REQUESTED : 사람이 조건을 고쳐 다시 보낼 수 있게 했다 (이번 범위에 일으킬 주체가 없다)"
      - "다시 보낼 때 상태를 되돌리지 않는다 — 이력을 읽어 없으면 그 자리에서 보낸다. 결제가 UNKNOWN 에 머문 채 승인을 다시 부르는 것과 같다"
    # 환불에는 "실패로 끝남"이 없다. 자동으로 갈 수 있는 종착은 SUCCEEDED 하나이고, MANUAL_REVIEW는
    # 종착이 아니라 "자동으로는 더 못 함, 사람이 처리해야 한다"는 뜻이다. 이름을 FAILED로 두면
    # 종결처럼 읽혀 후속 처리에서 누락되고, 거기서 나가는 두 전이가 이상해 보인다.
    # 검토 코드가 채워졌다는 것이 곧 MANUAL_REVIEW이며 둘은 함께 움직인다.

    access_rule: mutate-through-root, read-may-bypass

# 경계 밖. 어떤 불변식에도 참여하지 않고 판정에도 쓰이지 않는다. 자기 리포지토리로 저장하며 낙관
# 락을 갖지 않는다. 결제 쪽이 롤백돼도 "불렀다"는 사실이 남아야 하므로 별도 트랜잭션으로 커밋한다.
outside_boundary:
  - PgCallLog — 결제사 호출 기록. 승인·환불 호출을 한 곳에 쌓고 응답 원본을 담는다

# 한 aggregate 안에서 지킬 수 없어 트랜잭션이 지키는 것.
# 한 aggregate 안에서 지킬 수 없어 트랜잭션이 지키는 것 — 같은 타입의 다른 인스턴스에도 해당한다.
same_type_cross_instance:
  - name: 남의 승인으로 드러난 결제를 그 주인의 행에 붙인다
    scope: [Payment, Payment]
    how: >
      승인 응답의 결제 키가 우리 것과 다르면, 우리 결제를 종결하는 것과 그 키의 결제 행을 회수하는 것을
      한 트랜잭션으로 커밋한다. 나누면 앞엣것만 반영됐을 때 상대 결제가 아무도 보지 않는 상태로 남는
      구간이 대사 한 주기만큼 열린다. 두 행은 항상 식별자 오름차순으로 다뤄 서로 기다리지 않게 한다.
    notes: >
      회수는 번호를 심고 결과 불명으로 두는 데까지다. 확정이냐 환불이냐는 대사가 기존 경로로 정한다.
      상대 행이 이미 종착이거나 이미 호출 뒤이면 회수하지 않고 통지만 한다.

cross_aggregate_invariants:
  - name: 환불 총액이 결제사가 승인한 금액을 넘지 않는다
    scope: [Payment, Refund]
    how: >
      환불을 만드는 트랜잭션이 결제를 로드해 도메인 메서드에 판정시킨다. 승인 금액도 누적 환불액도
      결제 행에 있어 결제를 로드하는 것으로 판정에 필요한 것이 다 모인다. 통과하면 누적 환불액을
      더해 환불과 결제를 함께 저장한다. 그 갱신이 결제 행을 실제로 바꾸므로 낙관 락이 걸리고,
      동시에 온 두 요청 중 진 쪽은 그 버전에서 충돌해 환불까지 같은 트랜잭션에서 롤백된다.
      누적 환불액을 더하지 않으면 결제 행이 그대로여서 버전이 오르지 않고, 저장을 호출해도
      갱신 질의가 나가지 않아 방어가 통째로 사라진다.
    notes: >
      상태로 예외를 두지 않는다 — 환불에는 "환불하지 않기로 끝난 사건"이 없어 모든 사건이 살아 있다.
      환불 하나의 상태를 바꾸는 것은 이 불변식에 참여하지 않으므로 결제를 건드리지 않는다.
  - name: 승인 반려 환불은 결제당 한 건이다
    scope: [Payment, Refund]
    how: >
      그 결제에 요청자가 SYSTEM인 환불이 이미 있으면 금액을 다시 계산하지 않고 그것을 돌려준다.
      동시 실행은 위와 같은 장치가 막는다 — 반려 환불을 만들 때도 누적 환불액이 오르기 때문이다.
      결제가 이미 종착이라 상태 전이를 건너뛰는 경로에서도 그렇다. 그 경로는 전이만 건너뛰고
      환불은 만들므로 결제 행이 바뀐다.
    notes: >
      유일 제약이 받는 것은 같은 사유의 재실행이다 — 시스템 환불의 요청 멱등키가 사유 값이라
      (결제, 요청자, 키)가 같은 사유로 두 번 도는 것을 막는다. 사유가 다른 두 반려가 겹치는 것은
      키가 달라 제약에 걸리지 않으며, 그 자리는 결제 버전이 받는다.

# DB 유일 제약이 강제한다. 불변식이 아닌 이유는 둘이다 — 여러 aggregate 인스턴스에 걸쳐 있거나,
# 한 인스턴스 안이지만 동시 요청이라 메모리의 도메인 메서드로는 막을 수 없거나.
uniqueness:
  - 한 주문에 활성 결제는 최대 하나다 (활성 슬롯)
  - 환불 사건 키는 전체에서 유일하다
  - 환불 요청 멱등키는 한 결제의 한 요청자 안에서 유일하다 (같은 키의 동시 요청도 막는다)
  - 결제 시작 멱등키는 한 회원 안에서 유일하다 (기존 결제를 찾을 때도 회원과 함께 좁힌다)
  - 결제사에 보내는 결제 키는 전체에서 유일하다
  - 결제사 호출 멱등키는 전체에서 유일하다

# 어댑터가 결제사 코드를 이 넷으로 접어 넘긴다. 도메인은 넷만 안다.
# 접는 것은 승인·환불 양쪽이지만 그 넷이 어느 전이로 이어지는지는 갈린다.
refund_pg_result_vocabulary:
  - "됐다 -> SUCCEEDED"
  - "모른다 -> UNKNOWN"
  - "다시 시도할 수 있는 실패 -> 상태를 그대로 둔다 (대사가 다음 주기에 다시 집는다)"
  - "다시 시도할 수 없는 실패 -> MANUAL_REVIEW (검토 코드를 함께 채운다)"
# 환불 가능 금액 초과와 "이미 취소된 결제"는 상태를 바로 정하지 않고 이력을 읽어 세 갈래로 간다.
# 잔액 대조 옵션은 켜지 않으므로 "잔액이 어긋남" 갈래는 없다.

# 승인은 부르는 자리에 따라 갈린다. 첫 호출에는 앞선 호출이 없어 그 자리에서 종결하고,
# 대사 재요청에는 이미 나갔을 수 있는 앞선 호출이 있어 이번 실패로 종결하지 않는다.
payment_pg_result_vocabulary:
  - "됐다 -> SUCCEEDED (첫 호출·대사 같다)"
  - "모른다 -> UNKNOWN (대사에서는 상태 그대로)"
  - "다시 시도할 수 있는 실패 -> 첫 호출: FAILED 종결 + 슬롯 반납 / 대사: 상태를 그대로 둔다"
  - "다시 시도할 수 없는 실패 -> 첫 호출·대사 모두 FAILED 종결 + 슬롯 반납"
# 결제에는 MANUAL_REVIEW 가 없다.
# 대사가 자동으로 실패를 확정하는 근거는 승인 재요청에 "승인 가능 시간이 지났다"는 답을 받았을 때
# 하나뿐이다. 이번 요청이 실패했다는 답은 앞선 호출에 대한 답이 아니라 대사에서는 확정 근거가 못 된다.
# 첫 호출의 종결은 "이 호출로 돈이 안 나갔다"를 단언하는 것이다. 그 단언이 서는 것은 어댑터가
# 받아서 처리하다 잘못됐을 수 있는 것을 전부 "모른다"로 접기 때문이다 — 다시 시도할 수 있는 실패에는
# 연결이 안 섰거나 결제사가 처리하지 않았다고 답한 것만 남는다.
# 새 결제사의 응답 코드 표를 만들 때 애매한 코드를 이 갈래로 넣으면 이중결제 경로가 된다.

references_by_id:
  - Order (orderId)
  - Member (memberId)
  - Payment (paymentId) — 환불이 어느 결제의 것인지
