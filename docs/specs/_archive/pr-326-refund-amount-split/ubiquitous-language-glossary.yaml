# 이 spec이 쓰는 도메인 용어. 이번 작업이 새로 들이거나 뜻을 가르는 것만 담는다.
glossary:
  - term: 돌려주기로 한 금액
    definition: 이 결제에 열린 모든 환불 금액의 합. 환불이 실패하거나 사람에게 넘어가도 줄지 않는다.
    code_identifier: refundOpenedAmount
    notes: >
      지금의 total_refunded_amount 와 뜻·값이 같고 이름만 바뀐다. 옛 이름은 "이미 돌려준 돈"으로
      읽히는데 실제로는 아직 안 나간 것까지 포함해서다. 환불 상태 READY 인 것만 세는 값이 아니다 —
      성공한 환불도 여기 들어 있다.

  - term: 실제로 돌아간 금액
    definition: 이 결제에서 성공으로 확정된 환불 금액의 합.
    code_identifier: refundSucceededAmount
    notes: >
      이번에 새로 생긴다. 환불이 성공으로 확정되는 한 곳에서만 오른다. 그래서 이 값이 세는 것은 "실제로 나간 돈"이
      아니라 "우리가 결제사 응답으로 확정한 돈"이다. 실제와 어긋나는 길과 그 방향은 데이터 모델 문서가 정본이다.

  - term: 환불 한도
    definition: 앞으로 더 열 수 있는 환불 금액. 승인 금액에서 돌려주기로 한 금액을 뺀 값이다.
    code_identifier: remainingRefundableAmount
    notes: >
      이름이 "남은 환불 가능 금액"이라 아직 안 돌아온 돈으로 오해되기 쉽다. 성공한 환불도 이 한도를
      계속 잡고 있으므로 그 뜻이 아니다.

  - term: 아직 안 돌아온 금액
    definition: 돌려주기로 했으나 아직 결제사가 처리하지 않은 금액. 돌려주기로 한 금액에서 실제로 돌아간 금액을 뺀 값이다.
    code_identifier: (이번 범위에서 코드로 만들지 않는다)
    notes: 사람이 이어받아 멈춘 몫도 여기 섞여 있다. 그것을 따로 세는 것은 이 spec의 범위 밖이다.

  - term: 결제사 잔액 추정
    definition: 결제사 쪽에 아직 남아 있을 것으로 보이는 금액. 승인 금액에서 실제로 돌아간 금액을 뺀 값이다.
    code_identifier: (이번 범위에서 코드로 만들지 않는다)
    notes: >
      "추정"인 이유는 위 값이 실제와 어긋날 수 있어서다. 어긋나는 길과 방향은 데이터 모델 문서가 정본이다.
      이 값과 실제를 대조하는 것은 이 spec의 범위 밖이다.

  - term: 구동 환불
    definition: 결제사가 환불 가능 금액 초과로 거절해, 그 원인을 이력에서 찾게 만든 환불.
    code_identifier: ExecuteRefundUseCase 가 초과 거절을 받아 이력을 읽을 때의 그 환불
    notes: 아래 "형제 환불"과 짝이다. 이력을 읽는 흐름을 누가 시작했는지를 가리킨다.

  - term: 형제 환불
    definition: 같은 결제에 함께 열려 있는, 지금 다루는 것이 아닌 다른 미결 환불.
    code_identifier: RefundRepository.findUnsettledByPaymentId 가 돌려주는 것들
    notes: >
      결제사가 환불 가능 금액 초과로 거절했을 때 그 원인을 이력에서 찾는 자리가 이 말을 쓴다.
      이 spec 이 새로 들이는 말이라 여기 적는다.

  - term: 환불 확정
    definition: >
      결제사가 환불을 처리했음을 확인해 그 환불을 성공 상태로 옮기고, 같은 트랜잭션에서 결제가 그
      금액을 받아들이는 것까지를 함께 이르는 말.
    code_identifier: RefundService.complete
    notes: >
      이 변경 뒤로는 환불 한쪽 전이만 가리키지 않는다. 두 aggregate 가 한 트랜잭션에 든다.
      환불 한쪽만 가리킬 때는 아래 "환불 성공 전이"를 쓴다 — 이 spec 이 한 이름에 두 사실이 눌려
      담긴 것을 가르는 작업이라, 이 문서가 새로 들이는 말부터 한 뜻이어야 한다.

  - term: 환불 성공 전이
    definition: 환불 자신이 응답 대기·결과 불명에서 성공 상태로 옮겨 가는 것. 결제는 건드리지 않는다.
    code_identifier: Refund.complete
    notes: >
      상태 가드가 여기 있다. 앞 확정이 이미 커밋된 뒤에 오는 재확정을 이 가드가 거부한다.
      실제로 돌아간 금액 갱신이 이 가드 안쪽에 놓여야 이중 계상이 안 난다.
      한국어로는 위 "환불 확정"과 갈랐지만 코드 이름은 둘 다 complete 로 남는다 — 이름을 가르는 것은
      이 작업이 건드리지 않기로 한 자리이고, 어느 쪽인지는 부르는 계층이 정한다.

  - term: 환불 성공 수용
    definition: 결제가 어떤 환불의 성공을 받아들여 실제로 돌아간 금액에 그 금액을 더하는 것.
    code_identifier: Payment.recordRefundSuccess(int amount)
    notes: >
      "금액을 더한다"가 아니라 "환불이 성공했다는 사실을 결제가 남긴다"가 이 행위의 뜻이다. 결제 상태를
      조건으로 삼지 않고 금액 불변식만 검사한다. 이름을 record 로 고른 것은 이 저장소가 밖에서 확인된
      사실을 자기 행에 남기는 일을 전부 그 동사로 부르기 때문이다 — 승인 금액을 남기는 메서드가 구조가
      같은 자매다(결제사 응답으로 확정된 금액, 상태 전이가 아님, 금액 가드를 자기 안에 듦).
      금액만 받는다. 환불 객체가 필요 없어서다 — 그 환불이 이 결제 것인지는 부르는 트랜잭션이 결제
      식별자로 로드하며 이미 정해진다. 환불을 만드는 쪽이 객체를 받는 것은 기존 환불이 자기 것인지
      확인해야 해서이며, 그 확인이 필요 없는 이 자리에는 해당하지 않는다.
