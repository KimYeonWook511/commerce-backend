# 이 spec이 건드리는 aggregate 둘. 지금 코드의 경계를 그대로 적고, 이 작업이 바꾸는 곳만 표시한다.

aggregate:
  name: Payment
  root: Payment
  purpose: >
    한 번의 결제 시도에 대해 "얼마까지 돌려줄 수 있는가"와 "얼마가 실제로 돌아갔는가"를 지킨다.
    환불을 만들 자격을 판정하는 것이 이 aggregate이고, 그 판정의 근거인 금액도 여기 산다.
    이 작업 뒤로는 환불의 성공을 받아들이는 것도 여기서 한다.

  members:
    - Payment — 루트. 승인 금액과 환불 금액 합계 둘을 들고, 한도를 판정하고 환불의 성공을 수용한다

  invariants:
    - 0 ≤ 실제로 돌아간 금액 ≤ 돌려주기로 한 금액 ≤ 승인 금액        # 왼쪽 고리를 이 작업이 더한다. 오른쪽 고리는 지금도 있다
    - 돌려주기로 한 금액은 줄지 않는다 (환불이 실패해도 되돌리지 않는다)
    - 실제로 돌아간 금액은 줄지 않으며, 한 번에 더하는 금액은 0보다 크다
    - 승인 금액이 정해지지 않은 결제에는 한도를 물을 수 없다
    - 활성 슬롯은 한 주문에 하나만 살아 있다

  states: [READY, IN_PROGRESS, UNKNOWN, SUCCEEDED, FAILED, REJECTED, EXPIRED]
  transitions:
    - "이 작업은 결제의 상태 전이를 바꾸지 않는다. 환불 금액 합계는 상태와 직교하는 값이다"
    - "승인 금액을 담는 것은 상태 전이가 아니다 — 어느 종착에 이른 뒤에도 다시 담기며 코드가 그것을 막지 않는다"

  # aggregate 가 강제하지 않는 전제
  #
  # 승인 금액은 그 결제에 결제사가 승인한 금액 하나다. 위 전이 항목대로 코드가 재기록을 막지 않으므로
  # 이것은 Payment 가 지키는 불변식이 아니라 결제사 응답에 기대는 전제다. 그래서 invariants 에 두지
  # 않는다. 돌려주기로 한 금액 ≤ 승인 금액 이 이 전제 위에 서 있다.

  references_by_id:
    - Order (orderId)
    - Member (memberId)

---

aggregate:
  name: Refund
  root: Refund
  purpose: >
    "얼마를 왜 돌려준다"는 의도 하나의 생애를 지킨다. 금액은 만들어진 뒤 바뀌지 않는다 —
    결제의 두 금액이 그 전제 위에 서 있다.

  members:
    - Refund — 루트

  invariants:
    - 환불 금액은 0보다 크고 만들어진 뒤 바뀌지 않는다
    - 요청 멱등키는 요청자를 가리지 않고 반드시 있다

  states: [READY, IN_PROGRESS, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
  transitions:
    - "READY -> IN_PROGRESS : 결제사 호출 직전. 시도 번호가 오른다"
    - "IN_PROGRESS -> UNKNOWN : 응답을 못 받았다"
    - "IN_PROGRESS | UNKNOWN -> SUCCEEDED : 결제사가 처리했다"
    - "IN_PROGRESS | UNKNOWN -> MANUAL_REVIEW : 자동으로 더 못 간다. 사람이 이어받는다"
    - "MANUAL_REVIEW 에서 나가는 전이는 지금 없다"

  references_by_id:
    - Payment (paymentId)

# 경계에 대한 주의
#
# 이 작업은 환불의 성공 전이와 결제의 금액 수용을 한 트랜잭션에 묶는다. 결제를 올리는 것은 Refund 의
# 전이 메서드가 아니라 그 둘을 조합하는 트랜잭션 서비스다 — 전이 메서드가 결제를 받으면 식별자로만
# 참조하기로 한 경계가 무너진다.
#
# 이것은 aggregate 둘을 한 트랜잭션에서 저장하는 일이다. 나누면 환불만 성공으로 커밋되고 결제의
# 금액이 안 올라가 영구히 어긋난다. 같은 이유로 환불을 만드는 자리도 이미 둘을 함께 저장하고 있다.
#
# 경계를 넘어도 되는 기준: 결제의 금액 총량을 바꾸는 전이만이다. 이 경계가 서 있는 이유는 불변식이
# 아니라 낙관 락 경합이다 — 총량과 무관한 전이까지 결제를 건드리면 대사가 한 바퀴 돌 때마다 결제
# 버전이 오르고, 부분취소가 들어온 뒤로는 그 위에서 회원 요청이 밀린다.
