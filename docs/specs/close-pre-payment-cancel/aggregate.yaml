# 이 spec이 다루는 aggregate. 새로 만들지 않으며, 기존 경계를 그대로 적고 무엇이 바뀌는지 밝힌다.
aggregate:
  name: Order
  root: Order
  purpose: >
    한 주문 안에서 "무엇을 얼마나 샀고 그중 얼마나 취소됐는가"와 주문 상태가 서로 어긋나지 않게 지킨다.
    취소 값어치 계산과 상태 전이가 이 경계 안에서 끝나고, 취소를 접수할 수 있는 상태인지의 판정도
    여기 있다. 다만 그 판정을 언제 부를지와 결제 금액 조건은 결제완료 취소 관문이 주문 행을 잠근
    뒤에 정한다.

  members:
    - Order — 루트. 상태를 들고 전이를 판정한다
    - OrderItem — 주문 품목. 주문 시점 단가·수량과 취소된 수량을 들고 잔여수량을 계산해 답한다
    - OrderItemCancellation — 취소 한 번이 그 품목에서 몇 개였는지의 기록. 품목의 자식으로 남는다

  invariants:
    - 품목의 취소수량은 주문수량을 넘지 않는다
    - 결제완료 주문이 취소로 전이하는 것은 모든 품목의 잔여수량이 0일 때뿐이다
      # 결제 전 취소는 이 불변식의 예외가 아니라 적용 대상이 아니다 — 되돌릴 돈도 취소수량도 없다.
      # 두 전이를 하나의 규칙으로 합치려 하지 마라.
    - 주문 총액은 취소로 깎지 않는다 — 주문 시점 금액의 사본이고 결제 금액이 거기서 나왔다
    - 취소로 종착한 주문은 결제완료로 전이하지 않는다

  # OrderStatus에는 RECEIVED·COMPLETED도 있으나 그 상태를 만드는 전이가 프로덕션 코드에 없어
  # 도달하지 않는다. 도달하지 않으므로 빠져나오는 전이도 없다 — 결제 전 취소와 승인 확정 둘 다 거부한다.
  states: [INIT, PAID, CANCELED, RECEIVED(도달 불가), COMPLETED(도달 불가)]
  transitions:
    # 이 가드는 만료 선별이 지킨다. 전이 메서드 자신은 결제 전 상태인지만 확인한다.
    - "INIT -> CANCELED : 결제 전 취소. 가드는 만료 기준 시간 경과 AND 그 주문에 활성 슬롯을 쥔 결제가 없음. 이 spec 뒤에는 만료 배치만 이 전이를 일으킨다"
    - "INIT -> PAID : 승인 확정. 결제 성공과 같은 트랜잭션이다"
    - "PAID -> CANCELED : 결제완료 취소에서 모든 품목의 잔여수량이 0이 될 때"

  references_by_id:
    - Member (memberId)
    - Product (OrderItem.productId)
    - Refund (OrderItemCancellation이 환불 루트 식별자로만 가리킨다)

  # 이 spec이 바꾸는 것
  changes_in_this_spec:
    - 경계·불변식·상태·전이는 그대로 둔다
    - "INIT -> CANCELED 전이를 일으킬 수 있는 주체에서 회원 직접 취소를 뺀다"
    - "취소 가능 판정(checkCancellable)을 루트에 둔다. 결제완료가 아니면 던진다"
    - 그 판정은 새 규칙이 아니라 결제완료 취소 관문에 있던 상태 가드를 옮겨 온 것이다
    - 상태에서 파생되는 규칙이라 응용 계층이 아니라 이 경계 안에 둔다 — checkPayable과 같은 형태다
    - "품목 단위 판정 OrderItem.checkCancellable(수량)과 짝이다 — 하나는 주문 상태를, 하나는 품목 잔여수량을 본다"
